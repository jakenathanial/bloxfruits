<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blox Fruits Hunt & Trade Hub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
    }
    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #111827;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, doc, addDoc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, 
      onSnapshot, query, where, orderBy, limit, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getDatabase, ref, set, get, push, update, remove, onValue, off 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // --- Firebase Configuration ---
    const firebaseConfig = {
      apiKey: "AIzaSyADelISonKpsymat21iU_H-J20nVNWDttU",
      authDomain: "rentafruit2.firebaseapp.com",
      projectId: "rentafruit2",
      storageBucket: "rentafruit2.firebasestorage.app",
      messagingSenderId: "508277976942",
      appId: "1:508277976942:web:b16f1b15ee20923305db7f",
      measurementId: "G-TH3CKR5J51",
      databaseURL: "https://rentafruit2-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const dbFS = getFirestore(app);
    const dbRT = getDatabase(app);
    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({ prompt: "select_account" });

    // --- Lucide Icon Helper ---
    const Icon = ({ name, className = "w-5 h-5 inline-block", ...props }) => {
      const iconRef = React.useRef(null);
      React.useEffect(() => {
        if (window.lucide && iconRef.current) {
          window.lucide.createIcons({
            targets: [iconRef.current]
          });
        }
      }, [name]);
      return <i ref={iconRef} data-lucide={name} className={className} {...props}></i>;
    };

    // --- Initial Fruits Data ---
    const INITIAL_FRUITS = [
      { id: 'kitsune', name: 'Kitsune Fruit', value: 8000000, photo: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=200&q=80', rarity: 'Mythical', type: 'Devil Fruit' },
      { id: 'dragon', name: 'Dragon Fruit', value: 5000000, photo: 'https://images.unsplash.com/photo-1527325678964-54921641b908?auto=format&fit=crop&w=200&q=80', rarity: 'Mythical', type: 'Devil Fruit' },
      { id: 'leopard', name: 'Leopard Fruit', value: 4500000, photo: 'https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?auto=format&fit=crop&w=200&q=80', rarity: 'Mythical', type: 'Devil Fruit' },
      { id: 'dough', name: 'Dough Fruit', value: 2800000, photo: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=200&q=80', rarity: 'Mythical', type: 'Devil Fruit' },
      { id: 'buddha', name: 'Buddha Fruit', value: 1200000, photo: 'https://images.unsplash.com/photo-1615485290382-441e4d049cb5?auto=format&fit=crop&w=200&q=80', rarity: 'Legendary', type: 'Devil Fruit' },
      { id: 'portal', name: 'Portal Fruit', value: 1900000, photo: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=200&q=80', rarity: 'Legendary', type: 'Devil Fruit' },
      { id: 'blizzard', name: 'Blizzard Fruit', value: 1500000, photo: 'https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=200&q=80', rarity: 'Legendary', type: 'Devil Fruit' },
      { id: 'magma', name: 'Magma Fruit', value: 850000, photo: 'https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=200&q=80', rarity: 'Rare', type: 'Devil Fruit' },
      { id: 'light', name: 'Light Fruit', value: 650000, photo: 'https://images.unsplash.com/photo-1509114397022-ed747cca3f65?auto=format&fit=crop&w=200&q=80', rarity: 'Rare', type: 'Devil Fruit' },
      { id: 'flame', name: 'Flame Fruit', value: 250000, photo: 'https://images.unsplash.com/photo-1517824806704-9040b037703b?auto=format&fit=crop&w=200&q=80', rarity: 'Uncommon', type: 'Devil Fruit' },
      { id: '2x-money', name: '2x Money Gamepass', value: 4500000, photo: 'https://images.unsplash.com/photo-1559526324-4b87b5e36e44?auto=format&fit=crop&w=200&q=80', rarity: 'Mythical', type: 'Game Pass' },
      { id: 'fast-boats', name: 'Fast Boats Gamepass', value: 3500000, photo: 'https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=200&q=80', rarity: 'Legendary', type: 'Game Pass' }
    ];

    const formatValue = (num) => {
      if (!num) return '0';
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(0) + 'K';
      return num.toLocaleString();
    };

    const getRarityBadge = (rarity) => {
      switch(rarity) {
        case 'Mythical': return 'bg-purple-900/60 text-purple-300 border-purple-500/40';
        case 'Legendary': return 'bg-amber-900/60 text-amber-300 border-amber-500/40';
        case 'Rare': return 'bg-blue-900/60 text-blue-300 border-blue-500/40';
        case 'Uncommon': return 'bg-emerald-900/60 text-emerald-300 border-emerald-500/40';
        default: return 'bg-slate-800 text-slate-300 border-slate-600';
      }
    };

    // --- APP COMPONENT ---
    function App() {
      const [user, setUser] = React.useState(null);
      const [view, setView] = React.useState('home'); // home, destination, room, trade, values, calculator, admin
      const [activeDestination, setActiveDestination] = React.useState(null);
      const [activeRoomId, setActiveRoomId] = React.useState(null);
      const [fruits, setFruits] = React.useState(INITIAL_FRUITS);
      const [showGuestModal, setShowGuestModal] = React.useState(false);
      const [hasBeastBoat, setHasBeastBoat] = React.useState(false);

      // Listen for auth state
      React.useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
          if (currentUser) {
            let boatState = false;
            try {
              const userDocRef = doc(dbFS, 'users', currentUser.uid);
              const userSnap = await getDoc(userDocRef);
              if (userSnap.exists()) {
                boatState = userSnap.data().hasBeastBoat || false;
              } else {
                await setDoc(userDocRef, {
                  uid: currentUser.uid,
                  displayName: currentUser.displayName || 'Blox Pirate',
                  photoURL: currentUser.photoURL || '',
                  hasBeastBoat: false,
                  email: currentUser.email
                });
              }
            } catch (err) {
              console.warn("User profile fetch error (using auth default):", err);
            }
            setUser({
              uid: currentUser.uid,
              displayName: currentUser.displayName || 'Blox Pirate',
              photoURL: currentUser.photoURL || '',
              hasBeastBoat: boatState,
              email: currentUser.email
            });
            setHasBeastBoat(boatState);
          } else {
            // Check local guest profile
            const localGuest = localStorage.getItem('blox_guest_profile');
            if (localGuest) {
              try {
                const parsed = JSON.parse(localGuest);
                setUser(parsed);
                setHasBeastBoat(parsed.hasBeastBoat || false);
              } catch (e) {
                setUser(null);
              }
            } else {
              setUser(null);
            }
          }
        });
        return () => unsubscribe();
      }, []);

      // Realtime Fruits catalog sync from Firestore
      React.useEffect(() => {
        const fruitsRef = collection(dbFS, 'fruits');
        const unsubscribe = onSnapshot(fruitsRef, (snapshot) => {
          if (!snapshot.empty) {
            const list = snapshot.docs.map(docSnap => ({
              id: docSnap.id,
              ...docSnap.data()
            }));
            setFruits(list);
          }
        }, (err) => {
          console.warn("Fruits catalog snapshot fallback to default list:", err);
        });
        return () => unsubscribe();
      }, []);

      const toggleBeastBoat = async () => {
        const nextState = !hasBeastBoat;
        setHasBeastBoat(nextState);
        if (user) {
          const updatedUser = { ...user, hasBeastBoat: nextState };
          setUser(updatedUser);
          if (user.isGuest) {
            localStorage.setItem('blox_guest_profile', JSON.stringify(updatedUser));
          } else {
            await updateDoc(doc(dbFS, 'users', user.uid), { hasBeastBoat: nextState }).catch(() => {});
          }
        }
      };

      const handleGoogleLogin = async () => {
        try {
          await signInWithPopup(auth, googleProvider);
        } catch (err) {
          console.error('Google Sign-in error:', err);
        }
      };

      const handleLogout = async () => {
        await signOut(auth);
        localStorage.removeItem('blox_guest_profile');
        setUser(null);
        setHasBeastBoat(false);
      };

      const handleGuestSave = (name) => {
        const guestUser = {
          uid: 'guest_' + Math.random().toString(36).substring(2, 9),
          displayName: name,
          photoURL: '',
          hasBeastBoat: false,
          isGuest: true
        };
        setUser(guestUser);
        setHasBeastBoat(false);
        localStorage.setItem('blox_guest_profile', JSON.stringify(guestUser));
        setShowGuestModal(false);
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div 
                className="flex items-center gap-3 cursor-pointer"
                onClick={() => { setView('home'); setActiveDestination(null); }}
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20 font-bold text-xl font-display">
                  🏴‍☠️
                </div>
                <div>
                  <h1 className="font-display font-bold text-lg bg-gradient-to-r from-cyan-400 to-indigo-300 bg-clip-text text-transparent">
                    Blox Hub
                  </h1>
                  <p className="text-xs text-slate-400">Hunt & Trade Community</p>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="hidden md:flex items-center gap-1 bg-slate-800/60 p-1 rounded-xl border border-slate-700/50">
                <button 
                  onClick={() => setView('home')}
                  className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${view === 'home' || view === 'destination' || view === 'room' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-300 hover:text-white'}`}
                >
                  ⛵ Hunt Rooms
                </button>
                <button 
                  onClick={() => setView('trade')}
                  className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${view === 'trade' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-300 hover:text-white'}`}
                >
                  🔄 Trade Board
                </button>
                <button 
                  onClick={() => setView('values')}
                  className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${view === 'values' || view === 'calculator' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-300 hover:text-white'}`}
                >
                  📊 Value List
                </button>
                <button 
                  onClick={() => setView('admin')}
                  className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${view === 'admin' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-300 hover:text-white'}`}
                >
                  ⚙️ Admin
                </button>
              </nav>

              {/* User / Beast Boat controls */}
              <div className="flex items-center gap-3">
                {/* Beast Boat Toggle */}
                <button 
                  onClick={toggleBeastBoat}
                  className={`flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs font-semibold transition ${
                    hasBeastBoat 
                      ? 'bg-amber-500/20 text-amber-300 border-amber-500/50 shadow-sm shadow-amber-500/20' 
                      : 'bg-slate-800/80 text-slate-400 border-slate-700 hover:text-slate-200'
                  }`}
                  title="Toggle Beast Boat status"
                >
                  <Icon name="ship" className="w-4 h-4" />
                  <span className="hidden sm:inline">Beast Boat:</span>
                  <span>{hasBeastBoat ? 'YES' : 'NO'}</span>
                </button>

                {user ? (
                  <div className="flex items-center gap-2">
                    <div className="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                      {user.photoURL ? (
                        <img src={user.photoURL} alt="" className="w-6 h-6 rounded-full" />
                      ) : (
                        <div className="w-6 h-6 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold">
                          {user.displayName ? user.displayName.charAt(0).toUpperCase() : 'P'}
                        </div>
                      )}
                      <span className="text-xs font-medium max-w-[100px] truncate">{user.displayName}</span>
                    </div>
                    <button 
                      onClick={handleLogout}
                      className="text-xs text-slate-400 hover:text-red-400 transition p-1.5 bg-slate-800/50 rounded-lg border border-slate-700"
                      title="Sign Out"
                    >
                      <Icon name="log-out" className="w-4 h-4" />
                    </button>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={handleGoogleLogin}
                      className="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow-md shadow-indigo-600/30"
                    >
                      <Icon name="log-in" className="w-4 h-4" />
                      <span>Google Login</span>
                    </button>
                    <button 
                      onClick={() => setShowGuestModal(true)}
                      className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium px-2.5 py-2 rounded-lg border border-slate-700 transition"
                    >
                      Guest
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
            {view === 'home' && (
              <HomeView 
                onSelectDestination={(dest) => { setActiveDestination(dest); setView('destination'); }} 
                onGoToTrade={() => setView('trade')}
                onGoToValues={() => setView('values')}
              />
            )}

            {view === 'destination' && (
              <DestinationView 
                destination={activeDestination}
                user={user}
                hasBeastBoat={hasBeastBoat}
                onBack={() => setView('home')}
                onEnterRoom={(roomId) => { setActiveRoomId(roomId); setView('room'); }}
                onRequireLogin={() => setShowGuestModal(true)}
              />
            )}

            {view === 'room' && (
              <RoomView 
                roomId={activeRoomId}
                user={user}
                hasBeastBoat={hasBeastBoat}
                onLeave={() => { setActiveRoomId(null); setView('destination'); }}
              />
            )}

            {view === 'trade' && (
              <TradeBoardView 
                user={user}
                fruits={fruits}
                onRequireLogin={() => setShowGuestModal(true)}
              />
            )}

            {(view === 'values' || view === 'calculator') && (
              <ValueListAndCalculatorView 
                fruits={fruits}
                initialTab={view}
              />
            )}

            {view === 'admin' && (
              <AdminView 
                fruits={fruits}
                user={user}
              />
            )}
          </main>

          {/* Mobile Bottom Nav */}
          <nav className="md:hidden sticky bottom-0 z-40 bg-slate-900/95 border-t border-slate-800 px-2 py-2 flex items-center justify-around text-xs">
            <button 
              onClick={() => { setView('home'); setActiveDestination(null); }}
              className={`flex flex-col items-center gap-1 p-1 ${view === 'home' || view === 'destination' || view === 'room' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}
            >
              <Icon name="compass" className="w-5 h-5" />
              <span>Hunts</span>
            </button>
            <button 
              onClick={() => setView('trade')}
              className={`flex flex-col items-center gap-1 p-1 ${view === 'trade' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}
            >
              <Icon name="arrow-right-left" className="w-5 h-5" />
              <span>Trades</span>
            </button>
            <button 
              onClick={() => setView('values')}
              className={`flex flex-col items-center gap-1 p-1 ${view === 'values' || view === 'calculator' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}
            >
              <Icon name="bar-chart-2" className="w-5 h-5" />
              <span>Values</span>
            </button>
            <button 
              onClick={() => setView('admin')}
              className={`flex flex-col items-center gap-1 p-1 ${view === 'admin' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}
            >
              <Icon name="settings" className="w-5 h-5" />
              <span>Admin</span>
            </button>
          </nav>

          {/* Footer */}
          <footer className="border-t border-slate-800 bg-slate-950 py-6 text-center text-xs text-slate-500">
            <p>© 2026 Blox Fruits Hunt & Trade Hub. Realtime Firebase Firestore & RTDB Edition.</p>
          </footer>

          {/* Guest Login Modal */}
          {showGuestModal && (
            <GuestModal 
              onClose={() => setShowGuestModal(false)}
              onSave={handleGuestSave}
              onGoogleLogin={handleGoogleLogin}
            />
          )}
        </div>
      );
    }

    // --- HOME VIEW ---
    function HomeView({ onSelectDestination, onGoToTrade, onGoToValues }) {
      return (
        <div className="space-y-8">
          {/* Hero Banner */}
          <div className="relative rounded-2xl overflow-hidden bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 border border-slate-800 p-6 md:p-10 shadow-2xl">
            <div className="relative z-10 max-w-2xl space-y-4">
              <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">
                ⚡ Realtime Seabeast Hunts & Fruit Trading
              </span>
              <h2 className="text-3xl md:text-5xl font-extrabold font-display leading-tight bg-gradient-to-r from-white via-slate-100 to-indigo-200 bg-clip-text text-transparent">
                Find Sea Hunt Squads & Best Fruit Trades Instantly
              </h2>
              <p className="text-slate-400 text-sm md:text-base">
                Join live hunt lobbies for Tiki Outpost & Hydra Island with Beast Boat hosts, or post devil fruit listings on the global Blox Trade board.
              </p>
              <div className="flex flex-wrap gap-3 pt-2">
                <button 
                  onClick={() => onSelectDestination('Tiki Outpost')}
                  className="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm px-5 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center gap-2"
                >
                  <Icon name="compass" className="w-4 h-4" />
                  <span>Explore Tiki Outpost</span>
                </button>
                <button 
                  onClick={onGoToTrade}
                  className="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm px-5 py-2.5 rounded-xl border border-slate-700 transition flex items-center gap-2"
                >
                  <Icon name="arrow-right-left" className="w-4 h-4" />
                  <span>Browse Trades</span>
                </button>
              </div>
            </div>
          </div>

          {/* Destinations Grid */}
          <div>
            <h3 className="text-xl font-bold font-display text-white mb-4 flex items-center gap-2">
              <Icon name="map-pin" className="w-5 h-5 text-indigo-400" />
              <span>Select Seabeast Hunt Location</span>
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {/* Tiki Outpost Card */}
              <div 
                onClick={() => onSelectDestination('Tiki Outpost')}
                className="group relative rounded-2xl bg-slate-900 border border-slate-800 p-6 hover:border-indigo-500/50 transition duration-300 cursor-pointer shadow-lg overflow-hidden"
              >
                <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl group-hover:bg-cyan-500/20 transition"></div>
                <div className="flex items-start justify-between">
                  <div className="space-y-2">
                    <span className="text-xs font-semibold px-2.5 py-1 rounded-md bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
                      Sea 3 • Danger Level 6
                    </span>
                    <h4 className="text-2xl font-bold font-display text-white group-hover:text-indigo-300 transition">
                      Tiki Outpost
                    </h4>
                    <p className="text-xs text-slate-400 max-w-sm">
                      Best location for Kitsune Shrine, Leviathan, and High Sea Danger 6 Seabeast spawns.
                    </p>
                  </div>
                  <div className="w-12 h-12 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 text-2xl group-hover:scale-110 transition">
                    🏝️
                  </div>
                </div>
                <div className="mt-6 flex items-center justify-between text-xs text-slate-400 pt-4 border-t border-slate-800/80">
                  <span className="flex items-center gap-1.5 text-indigo-300 font-medium">
                    <Icon name="users" className="w-4 h-4" /> Active Lobbies Available
                  </span>
                  <span className="text-indigo-400 font-semibold group-hover:translate-x-1 transition flex items-center gap-1">
                    Join Lobbies <Icon name="arrow-right" className="w-3.5 h-3.5" />
                  </span>
                </div>
              </div>

              {/* Hydra Island Card */}
              <div 
                onClick={() => onSelectDestination('Hydra Island')}
                className="group relative rounded-2xl bg-slate-900 border border-slate-800 p-6 hover:border-purple-500/50 transition duration-300 cursor-pointer shadow-lg overflow-hidden"
              >

    // --- DESTINATION VIEW ---
    function DestinationView({ destination, user, hasBeastBoat, onBack, onEnterRoom, onRequireLogin }) {
      const [rooms, setRooms] = React.useState([]);
      const [showCreateModal, setShowCreateModal] = React.useState(false);

      React.useEffect(() => {
        const roomsRef = ref(dbRT, 'rooms');
        const handleSnap = (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            const list = Object.keys(data)
              .map(id => ({ id, ...data[id] }))
              .filter(r => r.destination === destination && r.expiresAt > Date.now());
            setRooms(list);
          } else {
            setRooms([]);
          }
        };
        onValue(roomsRef, handleSnap);
        return () => off(roomsRef, 'value', handleSnap);
      }, [destination]);

      const handleCreateRoom = async (durationMins) => {
        if (!user) {
          onRequireLogin();
          return;
        }
        const roomId = 'room_' + Date.now();
        const now = Date.now();
        const newRoom = {
          destination,
          host: user.displayName,
          hostUid: user.uid,
          createdAt: now,
          expiresAt: now + durationMins * 60 * 1000,
          players: {
            [user.uid]: {
              uid: user.uid,
              name: user.displayName,
              hasBeastBoat: hasBeastBoat
            }
          }
        };
        await set(ref(dbRT, `rooms/${roomId}`), newRoom);
        setShowCreateModal(false);
        onEnterRoom(roomId);
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <button 
              onClick={onBack}
              className="flex items-center gap-1.5 text-sm text-slate-400 hover:text-white transition"
            >
              <Icon name="arrow-left" className="w-4 h-4" /> Back to Destinations
            </button>
            <button 
              onClick={() => {
                if (!user) onRequireLogin();
                else setShowCreateModal(true);
              }}
              className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition flex items-center gap-1.5 shadow-md shadow-indigo-600/30"
            >
              <Icon name="plus" className="w-4 h-4" /> Create Hunt Lobby
            </button>
          </div>

          <div>
            <h2 className="text-2xl font-bold font-display text-white">{destination} Lobbies</h2>
            <p className="text-xs text-slate-400">Join a party with active Beast Boats or start your own hunt lobby.</p>
          </div>

          {rooms.length === 0 ? (
            <div className="text-center py-12 bg-slate-900/50 rounded-2xl border border-slate-800 p-8">
              <Icon name="compass" className="w-12 h-12 text-slate-600 mx-auto mb-3" />
              <h3 className="text-lg font-semibold text-slate-300">No active lobbies for {destination}</h3>
              <p className="text-xs text-slate-500 max-w-sm mx-auto mt-1 mb-4">Be the first pirate to create a hunt room!</p>
              <button 
                onClick={() => {
                  if (!user) onRequireLogin();
                  else setShowCreateModal(true);

              >
                Create Room
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {rooms.map(room => {
                const players = room.players ? Object.values(room.players) : [];
                const roomHasBeast = players.some(p => p.hasBeastBoat);
                const isFull = players.length >= 7;

                return (
                  <div

                    className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 hover:border-slate-700 transition"

                    <div className="flex items-start justify-between">
                      <div>
                        <h4 className="font-bold text-white font-display text-base">Host: {room.host}</h4>
                        <span className="text-xs text-slate-400">ID: {room.id.slice(-6)}</span>
                      </div>
                      {roomHasBeast && (
                        <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40">

                        </span>
                      )}
                    </div>

                    <div className="flex items-center justify-between text-xs text-slate-400 bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                      <span className="flex items-center gap-1">
                        <Icon name="users" className="w-4 h-4 text-slate-400" />

                      </span>
                      <span className="flex items-center gap-1">
                        <Icon name="clock" className="w-4 h-4 text-slate-400" />

              </div>
            </div>
          )}
        </div>
      );
    }

    // --- ROOM VIEW ---
    function RoomView({ roomId, user, hasBeastBoat, onLeave }) {
      const [room, setRoom] = React.useState(null);
      const [messages, setMessages] = React.useState([]);
      const [inputMsg, setInputMsg] = React.useState('');
      const chatEndRef = React.useRef(null);

      React.useEffect(() => {
        if (!roomId) return;
        const roomRef = ref(dbRT, `rooms/${roomId}`);
        const handleSnap = (snap) => {
          if (snap.exists()) {
            const data = snap.val();
            setRoom(data);
            // Ensure user is added to player list if not already
            if (user && (!data.players || !data.players[user.uid])) {
              update(ref(dbRT, `rooms/${roomId}/players/${user.uid}`), {
                uid: user.uid,
                name: user.displayName,
                hasBeastBoat: hasBeastBoat
              });
            }
          }
        };
        onValue(roomRef, handleSnap);
        return () => off(roomRef, 'value', handleSnap);
      }, [roomId, user, hasBeastBoat]);

      React.useEffect(() => {
        if (!roomId) return;
        const chatRef = ref(dbRT, `chats/${roomId}`);
        const handleChatSnap = (snap) => {
          if (snap.exists()) {
            const data = snap.val();
            const list = Object.keys(data).map(id => ({ id, ...data[id] }));
            setMessages(list);
            setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
          } else {
            setMessages([]);
          }
        };
        onValue(chatRef, handleChatSnap);
        return () => off(chatRef, 'value', handleChatSnap);
      }, [roomId]);

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!inputMsg.trim() || !user) return;
        const chatRef = ref(dbRT, `chats/${roomId}`);
        await push(chatRef, {
          uid: user.uid,
          name: user.displayName,
          text: inputMsg.trim(),
          ts: Date.now()
        });
        setInputMsg('');
      };

      const handleLeaveRoom = async () => {
        if (user && roomId) {
          await remove(ref(dbRT, `rooms/${roomId}/players/${user.uid}`)).catch(() => {});
        }
        onLeave();
      };

      if (!room) return <div className="text-center py-12 text-slate-400">Loading lobby data...</div>;

      const players = room.players ? Object.values(room.players) : [];

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <button 
              onClick={handleLeaveRoom}
              className="flex items-center gap-1.5 text-sm text-red-400 hover:text-red-300 transition bg-red-500/10 px-3 py-1.5 rounded-lg border border-red-500/20"
            >
              <Icon name="arrow-left" className="w-4 h-4" /> Leave Lobby
            </button>
            <div className="text-right">
              <span className="text-xs text-slate-400">Destination</span>
              <h3 className="font-bold text-white font-display">{room.destination}</h3>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Left: Players list */}
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
              <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                <h4 className="font-bold text-white font-display flex items-center gap-2">
                  <Icon name="users" className="w-4 h-4 text-indigo-400" />
                  <span>Party Members ({players.length}/7)</span>
                </h4>
              </div>
              <div className="space-y-2 max-h-[400px] overflow-y-auto">
                {players.map(p => (
                  <div key={p.uid} className="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <div className="flex items-center gap-2">
                      <div className="w-7 h-7 rounded-full bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center font-bold text-xs text-indigo-300">
                        {p.name ? p.name.charAt(0).toUpperCase() : 'P'}
                      </div>
                      <span className="text-xs font-semibold text-slate-200">{p.name}</span>
                      {p.uid === room.hostUid && (
                        <span className="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded font-bold">HOST</span>
                      )}
                    </div>
                    {p.hasBeastBoat ? (
                      <span className="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded border border-amber-500/30 font-bold flex items-center gap-1">
                        <Icon name="ship" className="w-3 h-3" /> Beast Boat
                      </span>
                    ) : (
                      <span className="text-[10px] text-slate-500">No Boat</span>
                    )}
                  </div>
                ))}
              </div>
            </div>

            {/* Right: Live Chat */}
            <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col h-[500px]">
              <div className="p-4 border-b border-slate-800 flex items-center gap-2 font-bold font-display text-white">
                <Icon name="message-square" className="w-4 h-4 text-indigo-400" />
                <span>Live Lobby Chat</span>
              </div>
              <div className="flex-1 p-4 overflow-y-auto space-y-3">
                {messages.length === 0 ? (
                  <div className="text-center text-slate-500 text-xs py-8">No messages yet. Say hello to your squad!</div>
                ) : (
                  messages.map(m => (
                    <div key={m.id} className="space-y-1">
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-bold text-indigo-400">{m.name}</span>
                        <span className="text-[10px] text-slate-500">{new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                      </div>
                      <p className="text-xs text-slate-200 bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 inline-block max-w-md">
                        {m.text}
                      </p>
                    </div>
                  ))
                )}
                <div ref={chatEndRef} />
              </div>

              <form onSubmit={handleSendMessage} className="p-3 border-t border-slate-800 flex gap-2">
                <input 
                  type="text" 
                  value={inputMsg}
                  onChange={(e) => setInputMsg(e.target.value)}
                  placeholder="Type message..."
                  className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                />
                <button 
                  type="submit"
                  className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold transition"
                >
                  Send
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // --- TRADE BOARD VIEW ---
    function TradeBoardView({ user, fruits, onRequireLogin }) {
      const [trades, setTrades] = React.useState([]);
      const [filter, setFilter] = React.useState('all'); // all, open, closed
      const [showCreateTradeModal, setShowCreateTradeModal] = React.useState(false);
      const [selectedTrade, setSelectedTrade] = React.useState(null);

      // Fetch trades ordered by createdAt desc
      React.useEffect(() => {
        const tradesRef = collection(dbFS, 'trades');
        const q = query(tradesRef, orderBy('createdAt', 'desc'), limit(50));
        const unsubscribe = onSnapshot(q, (snapshot) => {
          const list = snapshot.docs.map(docSnap => ({
            id: docSnap.id,
            ...docSnap.data()
          }));
          setTrades(list);
        }, (error) => {
          console.warn('Trade query error, fallback without order:', error);
          // Fallback query if index is building
          onSnapshot(tradesRef, (snap) => {
            const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            setTrades(list);
          });
        });
        return () => unsubscribe();
      }, []);

      const filteredTrades = trades.filter(t => {
        if (filter === 'open') return t.status === 'open';
        if (filter === 'closed') return t.status === 'closed';
        return true;
      });

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <h2 className="text-2xl font-bold font-display text-white">Blox Fruits Trade Board</h2>

              <button

                onClick={() => setFilter(f)}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold capitalize transition ${

                      {trade.username ? trade.username.charAt(0).toUpperCase() : 'U'}
                    </div>
                    <span className="text-xs font-bold text-white">{trade.username}</span>
                  </div>
                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${

                      : 'bg-slate-800 text-slate-500'

    // --- CREATE TRADE MODAL ---
    function CreateTradeModal({ user, fruits, onClose }) {
      const [offering, setOffering] = React.useState([]);
      const [wanting, setWanting] = React.useState([]);
      const [note, setNote] = React.useState('');
      const [pickerMode, setPickerMode] = React.useState(null); // 'offering' | 'wanting'

      const handleAddFruit = (fruit) => {
        if (pickerMode === 'offering') {
          if (offering.length < 4) setOffering([...offering, fruit]);
        } else if (pickerMode === 'wanting') {
          if (wanting.length < 4) setWanting([...wanting, fruit]);
        }
        setPickerMode(null);
      };

      const handleSubmitTrade = async () => {
        if (offering.length === 0) return;
        const newTrade = {
          ownerId: user.uid,
          username: user.displayName,
          offering: offering.map(f => ({ name: f.name, rarity: f.rarity, photo: f.photo, value: f.value })),
          wanting: {
            fruits: wanting.map(f => ({ name: f.name, rarity: f.rarity, photo: f.photo, value: f.value })),
            note
          },
          status: 'open',
          createdAt: serverTimestamp()
        };
        await addDoc(collection(dbFS, 'trades'), newTrade);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-5">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <h3 className="font-bold font-display text-lg text-white">Create New Trade Listing</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            {/* Offering Section */}
            <div className="space-y-2">
              <label className="text-xs font-bold text-slate-300">Your Offering (Max 4)</label>
              <div className="grid grid-cols-4 gap-2">
                {offering.map((f, i) => (
                  <div key={i} className="relative bg-slate-950 p-2 rounded-xl border border-slate-800 text-center text-xs">
                    <button onClick={() => setOffering(offering.filter((_, idx) => idx !== i))} className="absolute top-1 right-1 text-slate-500 hover:text-red-400">✕</button>
                    <div className="font-semibold text-slate-200 text-[11px] truncate">{f.name}</div>
                  </div>
                ))}
                {offering.length < 4 && (
                  <button 
                    onClick={() => setPickerMode('offering')}
                    className="h-16 border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-xl flex items-center justify-center text-slate-400 hover:text-indigo-400 transition text-xs font-semibold"
                  >
                    + Add
                  </button>
                )}
              </div>
            </div>

            {/* Wanting Section */}

    // --- VALUE LIST AND CALCULATOR VIEW ---
    function ValueListAndCalculatorView({ fruits, initialTab }) {
      const [activeTab, setActiveTab] = React.useState(initialTab); // 'values' | 'calculator'
      const [search, setSearch] = React.useState('');
      const [rarityFilter, setRarityFilter] = React.useState('All');

      // Calculator State
      const [sideA, setSideA] = React.useState([]);
      const [sideB, setSideB] = React.useState([]);
      const [pickerTarget, setPickerTarget] = React.useState(null);

      const filteredFruits = fruits.filter(f => {
        const matchesSearch = f.name.toLowerCase().includes(search.toLowerCase());
        const matchesRarity = rarityFilter === 'All' || f.rarity === rarityFilter || (rarityFilter === 'Game Pass' && f.type === 'Game Pass');
        return matchesSearch && matchesRarity;
      });

      const totalValA = sideA.reduce((sum, item) => sum + (item.value || 0), 0);
      const totalValB = sideB.reduce((sum, item) => sum + (item.value || 0), 0);
      const diff = totalValA - totalValB;
      const getRating = () => {
        if (totalValA === 0 && totalValB === 0) return { text: 'Select Fruits', color: 'text-slate-400' };
        const ratio = totalValA / (totalValB || 1);
        if (ratio >= 0.9 && ratio <= 1.1) return { text: 'Fair Trade (F)', color: 'text-emerald-400' };
        if (ratio > 1.1) return { text: 'Win for Side B / Overpay', color: 'text-amber-400' };
        return { text: 'Win for Side A / Underpay', color: 'text-indigo-400' };
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <h2 className="text-2xl font-bold font-display text-white">Blox Fruits Value Hub</h2>
              <p className="text-xs text-slate-400">Official trading values list & fair trade calculator.</p>
            </div>
            <div className="flex bg-slate-800 p-1 rounded-xl">
              <button 
                onClick={() => setActiveTab('values')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${activeTab === 'values' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
              >
                Value List
              </button>
              <button 
                onClick={() => setActiveTab('calculator')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${activeTab === 'calculator' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
              >
                Trade Calculator
              </button>
            </div>
          </div>

          {activeTab === 'values' ? (
            <div className="space-y-4">
              <div className="flex flex-wrap gap-2 items-center justify-between">
                <input 
                  type="text"
                  value={search}
                  onChange={e => setSearch(e.target.value)}
                  placeholder="Search fruits or gamepasses..."
                  className="bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-xs text-white max-w-xs w-full"
                />
                <div className="flex flex-wrap gap-1">
                  {['All', 'Mythical', 'Legendary', 'Rare', 'Uncommon', 'Game Pass'].map(r => (
                    <button 
                      key={r}
                      onClick={() => setRarityFilter(r)}
                      className={`px-2.5 py-1 rounded-lg text-[11px] font-semibold ${rarityFilter === r ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400 border border-slate-800'}`}
                    >
                      {r}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                {filteredFruits.map(f => (
                  <div key={f.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center gap-3">
                    <img src={f.photo} alt="" className="w-12 h-12 rounded-xl object-cover" />
                    <div>
                      <h4 className="font-bold text-white text-sm">{f.name}</h4>
                      <div className="text-indigo-400 font-extrabold text-xs">{formatValue(f.value)}</div>
                      <span className={`inline-block mt-1 px-2 py-0.5 rounded text-[9px] font-bold border ${getRarityBadge(f.rarity)}`}>
                        {f.rarity}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="space-y-6">
              <div className="text-center p-4 bg-slate-900 border border-slate-800 rounded-2xl space-y-1">
                <span className="text-xs text-slate-400">Trade Balance Rating</span>
                <h3 className={`text-xl font-bold font-display ${getRating().color}`}>{getRating().text}</h3>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {/* Side A */}
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h4 className="font-bold text-white text-sm">Side A Offer</h4>
                    <span className="text-indigo-400 font-bold text-xs">Total: {formatValue(totalValA)}</span>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    {sideA.map((item, idx) => (
                      <div key={idx} className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between">
                        <div>
                          <div className="font-semibold text-xs text-white">{item.name}</div>
                          <div className="text-[10px] text-slate-400">{formatValue(item.value)}</div>
                        </div>
                        <button onClick={() => setSideA(sideA.filter((_, i) => i !== idx))} className="text-slate-500 hover:text-red-400">✕</button>
                      </div>
                    ))}
                    {sideA.length < 4 && (
                      <button onClick={() => setPickerTarget('A')} className="h-16 border border-dashed border-slate-700 text-xs text-slate-400 rounded-xl hover:border-indigo-500">

                    <h4 className="font-bold text-white text-sm">Side B Offer</h4>
                    <span className="text-indigo-400 font-bold text-xs">Total: {formatValue(totalValB)}</span>

                        <div>
                          <div className="font-semibold text-xs text-white">{item.name}</div>
                          <div className="text-[10px] text-slate-400">{formatValue(item.value)}</div>
                        </div>
                        <button onClick={() => setSideB(sideB.filter((_, i) => i !== idx))} className="text-slate-500 hover:text-red-400">✕</button>
                      </div>
                    ))}
                    {sideB.length < 4 && (
                      <button onClick={() => setPickerTarget('B')} className="h-16 border border-dashed border-slate-700 text-xs text-slate-400 rounded-xl hover:border-indigo-500">
                        + Add Fruit
                      </button>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {pickerTarget && (
            <FruitPickerModal 
              fruits={fruits}
              onSelect={f => {
                if (pickerTarget === 'A') setSideA([...sideA, f]);
                else setSideB([...sideB, f]);
                setPickerTarget(null);
              }}
              onClose={() => setPickerTarget(null)}
            />
          )}
        </div>
      );
    }

              </button>
              <div className="relative text-center my-2">
                <span className="text-[10px] text-slate-500 bg-slate-900 px-2">OR</span>
              </div>
              <button 
                onClick={() => { onClose(); onGoogleLogin(); }}
                className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2"
              >
                Sign In with Google
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
