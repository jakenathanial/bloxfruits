<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RentAFruit — Leviathan Hunt & Trading</title>
<meta name="description" content="RentAFruit is a free community matchmaking tool for Blox Fruits players."/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#07071a;--card:#0e0e28;--purple:#b06ef3;--purple2:#7c3aed;
  --blue:#4f9ef8;--blue2:#22d3ee;--green:#34d399;--red:#f87171;
  --yellow:#fbbf24;--orange:#fb923c;--text:#eef2ff;--muted:#8b9bb4;
  --border:rgba(176,110,243,0.18);--gp:0 0 24px rgba(176,110,243,0.45);
  --gb:0 0 24px rgba(79,158,248,0.45);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 15%,rgba(176,110,243,0.1) 0%,transparent 55%),radial-gradient(ellipse at 85% 85%,rgba(79,158,248,0.08) 0%,transparent 55%);pointer-events:none;z-index:0;}
#app{position:relative;z-index:1;min-height:100vh;}

.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;}
.loader-fruit{font-size:52px;animation:bounce 1s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.loader-text{font-size:1rem;font-weight:700;color:var(--purple);letter-spacing:2px;}
.loader-sub{font-size:0.75rem;font-weight:600;color:var(--muted);}
.loader-bar-wrap{width:220px;height:6px;background:rgba(176,110,243,0.15);border-radius:99px;overflow:hidden;}
.loader-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--purple2),var(--purple),var(--blue2));border-radius:99px;transition:width 0.4s ease;}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-glow{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(176,110,243,0.13) 0%,transparent 65%);animation:breathe 4s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:0.5}}
.login-box{position:relative;background:rgba(14,14,40,0.97);border:1.5px solid var(--border);border-radius:24px;padding:48px 40px;max-width:430px;width:100%;text-align:center;box-shadow:var(--gp),0 32px 64px rgba(0,0,0,0.55);}
.login-fruit{font-size:68px;display:block;filter:drop-shadow(0 0 20px rgba(176,110,243,0.9));margin-bottom:10px;}
.login-title{font-family:'Orbitron',sans-serif;font-size:1.8rem;font-weight:900;background:linear-gradient(130deg,var(--purple),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.login-sub{font-size:0.7rem;letter-spacing:4px;color:var(--muted);font-weight:700;margin-top:4px;}
.login-desc{margin:18px 0 26px;color:var(--muted);font-size:1rem;line-height:1.6;}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.divider span{font-size:0.78rem;color:var(--muted);font-weight:700;}
.btn-google{display:flex;align-items:center;gap:10px;justify-content:center;width:100%;padding:14px 20px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.13);border-radius:12px;color:var(--text);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.22s;}
.btn-google:hover{background:rgba(255,255,255,0.11);transform:translateY(-2px);}
.btn-google:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.btn-guest{display:flex;align-items:center;gap:10px;justify-content:center;width:100%;padding:13px 20px;margin-top:10px;background:rgba(176,110,243,0.1);border:1.5px solid rgba(176,110,243,0.3);border-radius:12px;color:var(--purple);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.22s;}
.btn-guest:hover{background:rgba(176,110,243,0.18);transform:translateY(-2px);}
.login-err{margin-top:14px;padding:10px 14px;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);border-radius:9px;color:var(--red);font-size:0.85rem;display:none;}

.overlay-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:900;align-items:center;justify-content:center;padding:20px;}
.overlay-modal.show{display:flex;}
.modal-box{background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:30px;width:100%;max-width:400px;box-shadow:var(--gp);}
.modal-box h3{font-size:1.2rem;font-weight:800;margin-bottom:8px;}
.modal-box p{color:var(--muted);font-size:0.9rem;margin-bottom:18px;line-height:1.6;}
.name-input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.12);border-radius:10px;color:var(--text);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:600;outline:none;transition:border-color 0.2s;margin-bottom:12px;}
.name-input:focus{border-color:var(--purple);}
.name-input::placeholder{color:var(--muted);}
.btn-primary{width:100%;padding:12px;background:linear-gradient(130deg,var(--purple2),var(--purple));border:none;border-radius:10px;color:#fff;font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:800;cursor:pointer;transition:all 0.2s;}
.btn-primary:hover{transform:translateY(-2px);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.btn-x{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;line-height:1;}
.btn-x:hover{color:var(--text);}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:rgba(7,7,26,0.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.topbar-logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1rem;background:linear-gradient(90deg,var(--purple),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;cursor:pointer;letter-spacing:1px;user-select:none;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.t-avatar{width:34px;height:34px;border-radius:50%;border:2px solid var(--purple);object-fit:cover;}
.uname{font-size:0.88rem;font-weight:700;color:var(--muted);display:none;}
@media(min-width:480px){.uname{display:block;}}
.btn-sm{padding:6px 13px;background:transparent;border:1.5px solid var(--border);border-radius:8px;color:var(--muted);font-family:'Nunito',sans-serif;font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
.btn-sm:hover{border-color:var(--purple);color:var(--purple);}

.navbar{display:flex;align-items:center;gap:4px;padding:8px 22px;background:rgba(7,7,26,0.9);border-bottom:1px solid rgba(176,110,243,0.1);overflow-x:auto;scrollbar-width:none;}
.navbar::-webkit-scrollbar{display:none;}
.nav-btn{padding:6px 14px;border-radius:20px;font-size:0.82rem;font-weight:700;color:var(--muted);cursor:pointer;transition:all 0.2s;white-space:nowrap;border:1.5px solid transparent;}
.nav-btn:hover{color:var(--text);background:rgba(176,110,243,0.1);}
.nav-btn.active{color:var(--purple);background:rgba(176,110,243,0.12);border-color:rgba(176,110,243,0.3);}
.nav-btn.is-admin{color:var(--yellow);}
.nav-btn.is-admin.active{background:rgba(251,191,36,0.12);border-color:rgba(251,191,36,0.4);}

.main{max-width:1080px;margin:0 auto;padding:24px 18px;}

.profile-panel{background:rgba(176,110,243,0.06);border:1.5px solid var(--border);border-radius:18px;padding:16px 20px;margin-bottom:28px;}
.profile-inner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.pr-avatar{width:50px;height:50px;border-radius:50%;border:2px solid var(--purple);object-fit:cover;box-shadow:0 0 12px rgba(176,110,243,0.4);}
.pr-name{font-size:1rem;font-weight:800;color:var(--purple);}
.pr-badge{font-size:0.75rem;color:var(--muted);font-weight:600;margin-top:2px;}
.boat-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;}
.boat-label{font-size:0.9rem;font-weight:700;color:var(--text);}
.switch{position:relative;display:inline-block;width:52px;height:28px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.15);border-radius:28px;transition:0.3s;}
.slider::before{content:'';position:absolute;width:20px;height:20px;left:3px;bottom:3px;background:var(--muted);border-radius:50%;transition:0.3s;}
input:checked+.slider{background:rgba(52,211,153,0.25);border-color:var(--green);}
input:checked+.slider::before{transform:translateX(24px);background:var(--green);box-shadow:0 0 10px var(--green);}
.boat-ind{display:flex;align-items:center;gap:6px;font-size:0.88rem;font-weight:800;padding:5px 12px;border-radius:20px;transition:all 0.3s;}
.boat-ind.on{background:rgba(52,211,153,0.15);color:var(--green);border:1.5px solid rgba(52,211,153,0.35);}
.boat-ind.off{background:rgba(248,113,113,0.12);color:var(--red);border:1.5px solid rgba(248,113,113,0.3);}
.dot{width:8px;height:8px;border-radius:50%;}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.5s ease-in-out infinite;}
.dot.off{background:var(--red);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}

.hero{text-align:center;margin-bottom:32px;}
.hero-eye{font-size:0.72rem;letter-spacing:5px;color:var(--muted);font-weight:700;margin-bottom:8px;}
.hero-h1{font-family:'Orbitron',sans-serif;font-size:clamp(1.3rem,4vw,2.4rem);font-weight:900;line-height:1.25;}
.grad{background:linear-gradient(90deg,var(--purple),var(--blue2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-tip{margin-top:10px;font-size:0.9rem;color:var(--muted);font-weight:600;}

.dest-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;}
.dest-card{position:relative;overflow:hidden;background:rgba(14,14,40,0.9);border:1.5px solid var(--border);border-radius:20px;padding:38px 26px;text-align:center;cursor:pointer;transition:all 0.28s ease;}
.dest-card:hover{transform:translateY(-7px);border-color:var(--purple);box-shadow:var(--gp),0 20px 40px rgba(0,0,0,0.4);}
.dest-card:nth-child(2):hover{border-color:var(--blue);box-shadow:var(--gb),0 20px 40px rgba(0,0,0,0.4);}
.dest-glow{position:absolute;top:-50px;left:50%;transform:translateX(-50%);width:200px;height:200px;background:radial-gradient(circle,rgba(176,110,243,0.12),transparent 70%);pointer-events:none;}
.dest-glow.b{background:radial-gradient(circle,rgba(79,158,248,0.12),transparent 70%);}
.dest-icon{font-size:58px;display:block;margin-bottom:14px;filter:drop-shadow(0 0 14px rgba(176,110,243,0.7));}
.dest-name{font-size:1.2rem;font-weight:900;margin-bottom:6px;}
.dest-desc{font-size:0.85rem;color:var(--muted);margin-bottom:16px;font-weight:600;}
.dest-cta{font-size:0.88rem;font-weight:800;color:var(--purple);display:flex;align-items:center;justify-content:center;gap:6px;}
.dest-card:nth-child(2) .dest-cta{color:var(--blue);}

.pg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.pg-title{font-family:'Orbitron',sans-serif;font-size:1.25rem;font-weight:900;color:var(--purple);letter-spacing:1px;}
.btn-back{padding:8px 14px;background:transparent;border:1.5px solid var(--border);border-radius:9px;color:var(--muted);font-family:'Nunito',sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
.btn-back:hover{border-color:var(--purple);color:var(--purple);}
.btn-create{padding:10px 20px;background:linear-gradient(130deg,var(--purple2),var(--purple));border:none;border-radius:10px;color:#fff;font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:800;cursor:pointer;transition:all 0.25s;box-shadow:0 0 18px rgba(176,110,243,0.4);}
.btn-create:hover{transform:translateY(-2px);}
.btn-create:disabled{opacity:0.6;cursor:not-allowed;transform:none;}

.room-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:15px;min-height:120px;}
.room-card{background:rgba(14,14,40,0.94);border:1.5px solid var(--border);border-radius:16px;padding:18px;cursor:pointer;transition:border-color 0.25s,box-shadow 0.25s,transform 0.25s;}
.room-card:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:var(--gb);}
.room-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.room-host{font-size:0.95rem;font-weight:800;}
.timer-pill{font-size:0.7rem;font-weight:800;color:var(--blue2);background:rgba(34,211,238,0.1);border:1px solid rgba(34,211,238,0.3);padding:3px 9px;border-radius:20px;}
.room-stats{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.room-count{font-size:0.85rem;color:var(--muted);font-weight:600;}
.room-count.full{color:var(--red);font-weight:800;}
.room-beast{font-size:0.82rem;font-weight:800;}
.room-beast.yes{color:var(--green);}
.room-beast.no{color:var(--red);}
.btn-join{width:100%;padding:9px;background:linear-gradient(90deg,var(--blue2),var(--blue));border:none;border-radius:9px;color:#fff;font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:800;cursor:pointer;transition:all 0.18s;}
.btn-join:hover{opacity:0.85;transform:translateY(-1px);}
.btn-join.full{background:rgba(255,255,255,0.07);color:var(--muted);cursor:not-allowed;transform:none;}
.empty-msg{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 20px;border:1.5px dashed var(--border);border-radius:16px;font-size:0.95rem;font-weight:600;}

.room-layout{display:grid;grid-template-columns:1fr;gap:18px;}
@media(min-width:768px){.room-layout{grid-template-columns:1fr 360px;align-items:start;}}
.room-title-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
.room-h2{font-family:'Orbitron',sans-serif;font-size:1.25rem;font-weight:900;color:var(--purple);text-shadow:0 0 16px rgba(176,110,243,0.65);}
.room-timer-pill{font-size:0.82rem;font-weight:800;color:var(--blue2);background:rgba(34,211,238,0.1);border:1px solid rgba(34,211,238,0.3);padding:6px 14px;border-radius:20px;}
.beast-banner{padding:11px 16px;border-radius:11px;font-size:0.85rem;font-weight:800;text-align:center;margin-bottom:16px;}
.beast-banner.yes{background:rgba(52,211,153,0.1);border:1.5px solid rgba(52,211,153,0.4);color:var(--green);}
.beast-banner.no{background:rgba(248,113,113,0.1);border:1.5px solid rgba(248,113,113,0.35);color:var(--red);}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;}
.p-chip{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);border-radius:10px;padding:9px 11px;font-size:0.84rem;font-weight:700;}
.p-chip.me{border-color:var(--purple);background:rgba(176,110,243,0.09);}
.p-chip.empty{border-style:dashed;color:rgba(255,255,255,0.18);font-size:0.78rem;justify-content:center;}
.p-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.p-boat{font-size:0.95rem;flex-shrink:0;}
.p-boat.yes{filter:drop-shadow(0 0 5px rgba(52,211,153,0.9));}
.p-boat.no{opacity:0.3;}

.chat-panel{background:rgba(14,14,40,0.95);border:1.5px solid var(--border);border-radius:18px;display:flex;flex-direction:column;height:490px;}
.chat-head{padding:13px 16px;font-size:0.88rem;font-weight:800;color:var(--purple);border-bottom:1px solid var(--border);flex-shrink:0;}
.chat-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:rgba(176,110,243,0.35) transparent;}
.msg{display:flex;flex-direction:column;gap:3px;max-width:86%;}
.msg.me{align-self:flex-end;align-items:flex-end;}
.msg.other{align-self:flex-start;align-items:flex-start;}
.msg-who{font-size:0.68rem;color:var(--muted);font-weight:700;margin:0 4px;}
.msg-txt{padding:8px 13px;border-radius:12px;font-size:0.9rem;line-height:1.45;word-break:break-word;font-weight:600;}
.msg.me .msg-txt{background:linear-gradient(130deg,var(--purple2),var(--purple));color:#fff;}
.msg.other .msg-txt{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.07);}
.chat-foot{display:flex;gap:8px;padding:11px;border-top:1px solid var(--border);flex-shrink:0;}
.chat-input{flex:1;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:9px 13px;color:var(--text);font-family:'Nunito',sans-serif;font-size:0.93rem;font-weight:600;outline:none;transition:border-color 0.2s;}
.chat-input:focus{border-color:var(--purple);}
.chat-input::placeholder{color:var(--muted);}
.btn-send{padding:9px 16px;background:linear-gradient(130deg,var(--purple2),var(--purple));border:none;border-radius:10px;color:#fff;font-size:1rem;cursor:pointer;transition:all 0.18s;}
.btn-send:hover{opacity:0.85;transform:scale(1.05);}

.sec-title{font-family:'Orbitron',sans-serif;font-size:1.05rem;font-weight:900;color:var(--purple);letter-spacing:1px;margin-bottom:6px;}
.sec-desc{color:var(--muted);font-size:0.87rem;line-height:1.7;font-weight:600;margin-bottom:16px;}

/* Trade feed toolbar */
.tfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
.tchip{font-family:'Nunito',sans-serif;font-size:0.74rem;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;padding:6px 13px;border-radius:999px;border:1.5px solid var(--border);color:var(--muted);background:transparent;cursor:pointer;transition:all .15s ease;}
.tchip:hover{border-color:var(--purple);color:var(--text);}
.tchip.active{background:var(--purple);color:#1a0d2e;border-color:var(--purple);}
.tsearch{flex:1;min-width:180px;background:rgba(255,255,255,0.05);border:1.5px solid var(--border);color:var(--text);padding:9px 13px;border-radius:10px;font-size:0.85rem;font-family:'Nunito',sans-serif;font-weight:600;}
.tsearch::placeholder{color:var(--muted);}

/* Trade grid — no animation, prevents overlap */
.trade-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start;}
@media(max-width:860px){.trade-list{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:520px){.trade-list{grid-template-columns:minmax(0,1fr);}}

.trade-card{position:relative;background:rgba(12,12,32,0.96);border:1.5px solid rgba(176,110,243,0.14);border-radius:14px;padding:13px;cursor:pointer;display:flex;flex-direction:column;gap:9px;transition:border-color 0.22s,box-shadow 0.22s;}
.trade-card:hover{border-color:rgba(176,110,243,0.5);box-shadow:0 4px 20px rgba(176,110,243,0.15);}
.tc-top{display:flex;justify-content:space-between;align-items:center;}
.tc-poster{font-size:0.78rem;font-weight:800;color:var(--purple);}
.tc-age{font-size:0.65rem;color:var(--muted);font-weight:600;}
.tc-body{display:grid;grid-template-columns:1fr 16px 1fr;align-items:start;gap:5px;}
.tc-side-tag{font-size:0.6rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
.tc-side-tag.want{color:var(--blue2);}
.tc-side-tag.offer{color:var(--green);}
.tc-arrow{font-size:0.9rem;color:rgba(255,255,255,0.18);text-align:center;padding-top:20px;}
.tc-fruit-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.tc-fruit-tile{border-radius:8px;padding:5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center;}
.tc-fruit-tile.has-fruit{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);}
.tc-fruit-tile.empty-tile{background:rgba(255,255,255,0.02);border:1px dashed rgba(255,255,255,0.06);}
.tc-fruit-tile img{width:34px;height:34px;object-fit:contain;display:block;}

function fallbackImg(){ return "data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDQiIGhlaWdodD0iNDQiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHRleHQgeT0iMzIiIGZvbnQtc2l6ZT0iMzIiPvCfjooiPC90ZXh0Pjwvc3ZnPg=="; }
/* Only ever point <img src> at real http(s) URLs — this is what stops
   a bad/garbled admin entry (e.g. someone typing "hhttth" instead of
   "https://...") from firing a broken request against your own domain
   (that's what caused the "rentafruit.shop/hhttth 404" console error). */
function imgSrc(u){
  if(u && typeof u==="string" && /^https?:\/\//i.test(u.trim())) return esc(u.trim());
  return fallbackImg();
}
function tsMillis(ts){ return (ts && typeof ts.toMillis==="function") ? ts.toMillis() : Date.now(); }
function ago(ts){
  if(!ts) return "just now";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = Math.floor((Date.now()-d.getTime())/1000);
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}

function listenRooms(dest){
  const r=ref(dbRT,"rooms"); L_rooms=r;
  onValue(r, snap=>{
    const now=Date.now(), rooms=[];
    if(snap.exists()) snap.forEach(c=>{
      const rm={id:c.key,...c.val()};
      if(rm.expiresAt&&rm.expiresAt<now){remove(ref(dbRT,"rooms/"+c.key));return;}
      if(rm.destination===dest) rooms.push(rm);
    });
    renderRoomList(rooms);
  });
}
function renderRoomList(rooms){
  const el=document.getElementById("roomList"); if(!el)return;
  if(!rooms.length){el.innerHTML=`<div class="empty-msg">😴 No rooms yet! Hit ✨ Create Room to start the hunt!</div>`;return;}
  el.innerHTML=rooms.map(r=>{
    const pl=r.players?Object.values(r.players):[];
    const hb=pl.some(p=>p.hasBeastBoat===true), full=pl.length>=7;
    const rem=r.expiresAt?Math.max(0,r.expiresAt-Date.now()):0;

      <div class="room-head"><span class="room-host">👑 ${esc(r.host||"Unknown")}</span><span class="timer-pill">⏱ ${Math.floor(rem/60000)}m ${Math.floor((rem%60000)/1000)}s</span></div>

      <button class="btn-join ${full?"full":""}" onclick="event.stopPropagation();joinRoom('${r.id}')">${full?"Room Full 😔":"Join Room →"}</button>

/* ══════════════════════════════════════════════════════════
   FRUITS — Firestore, admin-managed, shared cache.
   Rebuilt so BOTH a one-time "ready" callback AND ongoing live
   updates are supported — previously, adding a fruit in the
   admin panel updated Firestore instantly but the on-screen
   list never refreshed until you navigated away and back.
══════════════════════════════════════════════════════════ */
let fruitsOneTimeCbs=[];
let fruitsLiveCbs=new Set();
function startFruitsListener(){
  if(U_fruits) return;
  U_fruits = onSnapshot(collection(dbFS,"fruits"), snap=>{
    fruitsCache={};
    snap.forEach(d=>fruitsCache[d.id]={id:d.id,...d.data()});
    fruitsReady=true;
    fruitsOneTimeCbs.forEach(f=>f()); fruitsOneTimeCbs=[];
    fruitsLiveCbs.forEach(f=>f());
  }, err=>{ console.error("[FRUITS]",err.message); });
}
function ensureFruits(cb){
  if(fruitsReady){ cb(); return; }
  fruitsOneTimeCbs.push(cb);
  startFruitsListener();
}
function onFruitsLive(cb){
  fruitsLiveCbs.add(cb);
  startFruitsListener();
  if(fruitsReady) cb();
  return ()=>fruitsLiveCbs.delete(cb);
}

/* ══════════════════════════════════════════════════════════
   TRADES — Firestore feed (Dealer's Dock counter-offer system)

   IMPORTANT FIX: the original query combined a `where(...)`
   filter with `orderBy(...)` on a different field. Firestore
   requires a manually-created composite index for that exact
   combination — without it the listener silently fails and the
   trade board never loads (this is almost certainly what you
   were seeing: rooms work because Realtime Database doesn't
   need indexes, trades didn't because Firestore does).
   Fixed by using a single equality filter only (auto-indexed by
   Firestore with zero setup) and sorting client-side instead.
══════════════════════════════════════════════════════════ */
function listenTrades(){
  if(U_trades) return;
  // Uses the "status ASC, createdAt DESC" composite index — server does the
  // filtering AND sorting now, so no client-side sort/discard needed.
  const q = query(collection(dbFS,"trades"), where("status","==","open"), orderBy("createdAt","desc"), limit(80));
  U_trades = onSnapshot(q, snap=>{
    tradesCache = snap.docs.map(d=>({id:d.id,...d.data()}));
    paintTradeFeed();
  }, err=>{
    console.error("[TRADES]",err.message);
    const el=document.getElementById("tradeList");
    if(el) el.innerHTML=`<div class="empty-msg" style="grid-column:1/-1">⚠️ Couldn't load trades.<br/><span style="font-size:0.75rem">${esc(err.message)}</span></div>`;
  });
}

function paintTradeFeed(){
  const rows = tradesCache.filter(t=>{
    if(t.status!=="open") return false;
    if(feedRarity!=="All"){
      const has = (t.offering||[]).some(f=>f.rarity===feedRarity) || (t.wanting?.fruits||[]).some(f=>f.rarity===feedRarity);
      if(!has) return false;
    }
    if(feedSearch){
      const s=feedSearch.toLowerCase();
      const hay=[t.username,...(t.offering||[]).map(f=>f.name),...((t.wanting?.fruits)||[]).map(f=>f.name),t.wanting?.note].filter(Boolean).join(" ").toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  });
  renderTradeGrid(rows);
  const countEl=document.getElementById("tradeCount");
  if(countEl) countEl.textContent = rows.length+" open "+(rows.length===1?"listing":"listings");
}

function fruitTileHtml(f){
  if(!f) return `<div class="tc-fruit-tile empty-tile"></div>`;
  return `<div class="tc-fruit-tile has-fruit r-${rc(f.rarity)}">
    <img src="${imgSrc(f.photo)}" alt="${esc(f.name)}" loading="lazy" decoding="async" onerror="this.src='${fallbackImg()}'"/>
    <span class="tc-fruit-name">${esc(f.name)}</span>
  </div>`;
}

function renderTradeGrid(rows){
  const el=document.getElementById("tradeList"); if(!el) return;
  if(!rows.length){
    el.innerHTML=`<div class="empty-msg" style="grid-column:1/-1">🤝 No trades match yet.<br/>Be the first to post one above!</div>`;
    return;
  }
  const html = rows.map(t=>{
    const wi=(t.wanting?.fruits)||[], oi=t.offering||[];
    const isOwn = CU && t.ownerId===CU.uid;
    const canDel = CU && (isOwn||isAdmin());
    const wTiles=[0,1,2,3].map(i=>fruitTileHtml(wi[i])).join("");
    const oTiles=[0,1,2,3].map(i=>fruitTileHtml(oi[i])).join("");
    return `<div class="trade-card" onclick="openTradeDetail('${t.id}')">
      <div class="tc-top">
        <span class="tc-poster">👤 ${esc(t.username)}${isOwn?` <span style="opacity:0.45;font-size:0.62rem">(you)</span>`:""}</span>
        <span class="tc-age">${ago(t.createdAt)}</span>
      </div>
      <div class="tc-body">
        <div><div class="tc-side-tag offer">Offers</div><div class="tc-fruit-grid">${oTiles}</div></div>
        <div class="tc-arrow">⇄</div>
        <div><div class="tc-side-tag want">Wants</div><div class="tc-fruit-grid">${wTiles}</div></div>
      </div>
      ${t.wanting?.note?`<div class="tc-note">"${esc(t.wanting.note)}"</div>`:""}
      <div class="tc-footer">
        ${canDel
          ? `<button class="btn-tc-del" onclick="event.stopPropagation();cancelTrade('${t.id}')">🗑 Cancel</button>`
          : `<span class="tc-tap-hint">tap to view →</span>`}
      </div>
    </div>`;
  }).join("");
  el.innerHTML = html;
}

function refreshTradeSlots(){
  ["offer","want"].forEach(side=>{
    const arr = side==="offer"?tradeOffering:tradeWanting;
    for(let i=0;i<4;i++){
      const el=document.getElementById(`sl-${side}-${i}`); if(!el)continue;
      const f=arr[i];
      if(f){
        el.className=`slot filled r-${rc(f.rarity)}`;
        el.innerHTML=`<img src="${imgSrc(f.photo)}" alt="${esc(f.name)}" loading="lazy" decoding="async" onerror="this.src='${fallbackImg()}'"/>
          <span class="s-name">${esc(f.name)}</span>
          <span class="s-rm" onclick="rmTradeSlot('${side}',${i},event)">✕</span>`;
        el.onclick=null;
      }else{
        el.className="slot"; el.innerHTML=`<span class="s-plus">+</span>`;
        el.onclick=()=>openPicker("trade",side,i);
      }
    }
  });
  const wv=document.getElementById("tvOffer"), ov=document.getElementById("tvWant");
  if(wv) wv.textContent="💰 "+tradeOffering.reduce((s,f)=>s+(f?Number(f.value||0):0),0).toLocaleString();
  if(ov) ov.textContent="💰 "+tradeWanting.reduce((s,f)=>s+(f?Number(f.value||0):0),0).toLocaleString();
}
window.rmTradeSlot=(side,i,e)=>{e.stopPropagation(); if(side==="offer")tradeOffering[i]=null; else tradeWanting[i]=null; refreshTradeSlots();};

function buildPickerUI(){

  tb.innerHTML = `<input class="tsearch" id="fpSearch" placeholder="Search fruits..." oninput="rebuildPickerGrid()"/>` +
    ["All",...RARITIES].map(r=>`<button class="tchip ${window._fpRarity===r||(!window._fpRarity&&r==="All")?"active":""}" onclick="setPickerRarity('${r}')">${r}</button>`).join("");

window.rebuildPickerGrid = () => {
  const grid=document.getElementById("fpGrid");
  const search=(document.getElementById("fpSearch")?.value||"").toLowerCase();
  const rarity=window._fpRarity||"All";
  const fruits=Object.values(fruitsCache).filter(f=>(rarity==="All"||f.rarity===rarity)&&f.name.toLowerCase().includes(search))
    .sort((a,b)=>({Mythical:0,Legendary:1,Rare:2,Uncommon:3,Common:4}[a.rarity]??5)-({Mythical:0,Legendary:1,Rare:2,Uncommon:3,Common:4}[b.rarity]??5));
  if(!fruits.length){grid.innerHTML=`<div class="no-fruits">No fruits found. ${Object.keys(fruitsCache).length===0?"Admin needs to add fruits first!":""}</div>`;return;}
  grid.innerHTML = fruits.map(f=>`
    <div class="fpicker-item r-${rc(f.rarity)}" onclick="pickFruitFor('${f.id}')">
      <img src="${imgSrc(f.photo)}" alt="${esc(f.name)}" loading="lazy" decoding="async" onerror="this.src='${fallbackImg()}'"/>
      <div class="fi-name">${esc(f.name)}</div>
      <span class="rp rp-${rc(f.rarity)}">${f.rarity||"?"}</span>
    </div>`).join("");
};
window.pickFruitFor = id => {
  if(!pickerCtx) return;
  const f = fruitsCache[id]; if(!f) return;
  const {mode,side,idx} = pickerCtx;
  if(mode==="trade"){
    if(side==="offer") tradeOffering[idx]=f; else tradeWanting[idx]=f;
    refreshTradeSlots();
  } else if(mode==="counter"){
    counterOffering[idx]=f;
    refreshCounterSlots();
  }
  closeModal("fruitPicker");
};

window.postTrade = async () => {
  if(!CU||isGuest){ alert("Please sign in to post a trade!"); return; }
  const errEl=document.getElementById("tfwErr");
  errEl.textContent="";
  const offering=tradeOffering.filter(Boolean);
  const wantFruits=tradeWanting.filter(Boolean);
  const note=document.getElementById("tfNote")?.value.trim()||"";
  if(!offering.length){ errEl.textContent="Pick at least one fruit you're offering."; return; }
  if(!wantFruits.length&&!note){ errEl.textContent="Say what you want back — pick fruits or add a note."; return; }

  const btn=document.getElementById("postBtn"); if(btn){btn.disabled=true;btn.textContent="Posting...";}
  try{
    // Enforce one active trade per user (single getDocs read — faster & simpler than opening a listener just to close it)
    const existSnap = await getDocs(query(collection(dbFS,"trades"), where("ownerId","==",CU.uid), where("status","==","open")));
    if(!existSnap.empty){
      errEl.textContent="⚠️ You already have an active trade! Cancel it before posting a new one.";
      if(btn){btn.disabled=false;btn.textContent="🤝 Post Trade";}
      return;
    }
    const ref = await addDoc(collection(dbFS,"trades"),{
      ownerId:CU.uid, username:CU.displayName,
      offering: offering.map(f=>({name:f.name,rarity:f.rarity,photo:f.photo||"",value:f.value||0})),
      wanting: { fruits: wantFruits.map(f=>({name:f.name,rarity:f.rarity,photo:f.photo||"",value:f.value||0})), note },
      status:"open", createdAt: serverTimestamp()
    });
    tradeOffering=[]; tradeWanting=[];
    tradeSubView="feed"; render("trade");
    openTradeDetail(ref.id);
  }catch(e){
    errEl.textContent="Couldn't post: "+e.message;
  }
  if(btn){btn.disabled=false;btn.textContent="🤝 Post Trade";}
};

window.openTradeDetail = tid => {
  tradeDetailId = tid;
  document.getElementById("tradeDetailModal").classList.add("show");
  document.getElementById("tradeDetailBody").innerHTML = "Loading...";
  if(U_tradeDetail) U_tradeDetail();
  U_tradeDetail = onSnapshot(doc(dbFS,"trades",tid), snap=>{
    if(!snap.exists()){
      document.getElementById("tradeDetailBody").innerHTML=`<div class="empty-msg">This trade no longer exists.</div>`;
      return;
    }
    currentTradeDetail = {id:snap.id,...snap.data()};
    renderTradeDetailBody();
  });
  if(U_offers) U_offers();
  /* Single equality filter only (no orderBy in the query) — same
     composite-index trap as the trades feed, fixed the same way:
     sort client-side after fetching instead. */
  const q = query(collection(dbFS,"offers"), where("tradeId","==",tid));
  U_offers = onSnapshot(q, snap=>{
    offersCache = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>tsMillis(a.createdAt)-tsMillis(b.createdAt));
    renderOffersThread();
  }, err=>{
    console.error("[OFFERS]",err.message);
  });
};

function refreshCounterSlots(){
  for(let i=0;i<4;i++){
    const el=document.getElementById(`csl-${i}`); if(!el)continue;
    const f=counterOffering[i];
    if(f){
      el.className=`slot filled r-${rc(f.rarity)}`;
      el.innerHTML=`<img src="${imgSrc(f.photo)}" alt="${esc(f.name)}" loading="lazy" decoding="async" onerror="this.src='${fallbackImg()}'"/>
        <span class="s-name">${esc(f.name)}</span>
        <span class="s-rm" onclick="counterOffering[${i}]=null;refreshCounterSlots();event.stopPropagation()">✕</span>`;
      el.onclick=null;
    }else{
      el.className="slot"; el.innerHTML=`<span class="s-plus">+</span>`;
      el.onclick=()=>openPicker("counter",null,i);
    }
  }
}
window.sendCounterOffer = async () => {
  const t = currentTradeDetail; if(!t) return;
  const sel = counterOffering.filter(Boolean);
  const note = document.getElementById("counterNote")?.value.trim()||"";
  const err = document.getElementById("counterErr");
  if(!sel.length&&!note){ if(err)err.textContent="Add at least one fruit or a note."; return; }
  await submitOffer(t.id,"counter",sel,note);
  document.getElementById("counterFormSlot").innerHTML="";
};

async function submitOffer(tradeId,type,offering,note){
  if(!CU||isGuest){ alert("Sign in to make an offer!"); return; }
  try{
    await addDoc(collection(dbFS,"offers"),{
      ownerId:CU.uid, tradeId, username:CU.displayName, type,
      offering: offering.map(f=>({name:f.name,rarity:f.rarity,photo:f.photo||"",value:f.value||0})),
      note, createdAt: serverTimestamp()
    });
  }catch(e){ alert("Couldn't send offer: "+e.message); }
}

function renderOffersThread(){
  const el = document.getElementById("offersThread"); if(!el) return;
  const t = currentTradeDetail;
  if(!offersCache.length){ el.innerHTML=`<div class="empty-msg" style="padding:24px">No offers yet — be the first to counter.</div>`; return; }
  const isOwner = CU && t && t.ownerId===CU.uid;
  const isOpen = t && t.status==="open";
  el.innerHTML = offersCache.map(o=>{
    const accepted = t && t.closedWith===o.id;
    return `<div class="offer-item ${accepted?"accepted":""}">
      <div class="offer-head">
        <span class="offer-name">👤 ${esc(o.username)}</span>
        <span class="offer-badge ${o.type}">${o.type==="accept"?(accepted?"✅ Accepted":"Sent what you asked"):(accepted?"✅ Accepted":"Counter offer")}</span>
      </div>
      <div class="offer-fruit-row">${(o.offering||[]).map(f=>`<div class="offer-fruit-chip"><img src="${imgSrc(f.photo)}" loading="lazy" decoding="async" onerror="this.src='${fallbackImg()}'"/>${esc(f.name)}</div>`).join("")||'<span style="color:var(--muted);font-size:0.72rem">no fruits listed</span>'}</div>
      ${o.note?`<div class="offer-note">"${esc(o.note)}"</div>`:""}
      <div class="offer-time">${ago(o.createdAt)}</div>
      ${(isOwner&&isOpen&&!accepted)?`<button class="btn-accept-offer" onclick="acceptOffer('${o.id}')">Accept this offer</button>`:""}

  }).join("");
}

window.addFruit = async () => {
  if(!isAdmin()) return;
  const name=document.getElementById("fn-name")?.value.trim();
  const value=document.getElementById("fn-value")?.value.trim();
  const photo=document.getElementById("fn-photo")?.value.trim();
  const rarity=document.getElementById("fn-rarity")?.value;
  const type=document.getElementById("fn-type")?.value;
  if(!name||!value||!photo||!rarity||!type){alert("Fill in all fields!");return;}
  if(isNaN(Number(value))||Number(value)<0){ alert("Value must be a positive number!"); return; }
  /* This check is what stops a mistyped URL like "hhttth" from ever
     being saved — that typo is what caused the rentafruit.shop/hhttth
     404 you were seeing (the browser was treating it as a relative
     path on your own domain instead of a real image link). */
  if(!/^https?:\/\//i.test(photo)){
    alert("⚠️ Photo URL must be a full link starting with http:// or https://\n\nExample: https://i.imgur.com/example.png");
    return;
  }
  const btn=document.getElementById("addFruitBtn"); if(btn){btn.disabled=true;btn.textContent="Adding...";}
  try{
    await addDoc(collection(dbFS,"fruits"),{name,value:Number(value),photo,rarity,type,addedAt:serverTimestamp()});
    document.getElementById("fn-name").value="";
    document.getElementById("fn-value").value="";
    document.getElementById("fn-photo").value="";
  }catch(e){ alert("Failed: "+e.message); }
  if(btn){btn.disabled=false;btn.textContent="➕ Add Item";}
};

  if(view==="about"){root.innerHTML=hdr+`<main class="main"><div class="cp">

    <div class="cs"><h2>🍊 What is RentAFruit?</h2><p>RentAFruit is a free, fan-made community platform for Blox Fruits players. Find hunt partners, coordinate Leviathan raids, and trade Devil Fruits — no download required.</p></div>
    <div class="cs"><h2>🐉 Leviathan Hunt System</h2><p>The Leviathan needs up to 7 players and at least one Beast Hunter Boat. Create or join rooms at Tiki Outpost or Hydra Island. Rooms use a live 1-hour timer and update in real time.</p></div>

    <div class="cs"><h2>👥 Community Built</h2><p>Fan-made, not affiliated with Roblox Corporation or the Blox Fruits team.</p>
    <div class="info-chips"><span class="ic">🆓 Free</span><span class="ic">⚡ Real-Time</span><span class="ic">📱 Mobile Friendly</span></div></div>
  </div></main>${footer}`;return;}

  if(view==="contact"){root.innerHTML=hdr+`<main class="main"><div class="cp">
    <h1>Contact Us</h1><p class="cp-sub">WE'D LOVE TO HEAR FROM YOU</p>
    <div class="cs"><h2>✉️ Reach Us</h2><p>Have a suggestion or found a bug? You can reach us directly at:</p>

    </div></div>
  </div></main>${footer}`;return;}

  if(view==="privacy"){root.innerHTML=hdr+`<main class="main"><div class="cp">
    <h1>Privacy Policy</h1><p class="cp-sub">LAST UPDATED: JANUARY 2025</p>
    <div class="cs"><h2>📋 Overview</h2><p>RentAFruit is committed to protecting user privacy.</p></div>
    <div class="cs"><h2>🔐 Data We Collect</h2><p>Google display name, profile photo URL, user ID, Beast Hunter Boat preference. Guest users only provide a chosen display name. Room and chat data lives in Firebase Realtime Database; trade and offer data lives in Firebase Firestore.</p></div>
    <div class="cs"><h2>🔧 How We Use It</h2><p>Solely to operate the platform. We do not sell your data.</p></div>

window.setFeedRarity = r => {
  feedRarity = r;
  document.querySelectorAll('.tfilters .tchip').forEach(ch=>{
    ch.classList.toggle('active', ch.textContent.trim()===r);
  });
  paintTradeFeed();
