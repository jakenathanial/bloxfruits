<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RentAFruit — Leviathan Hunt & Trading</title>
<meta name="description" content="RentAFruit is a free community matchmaking tool for Blox Fruits players."/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#07071a;--card:#0e0e28;--purple:#b06ef3;--purple2:#7c3aed;
  --blue:#4f9ef8;--blue2:#22d3ee;--green:#34d399;--red:#f87171;
  --yellow:#fbbf24;--orange:#fb923c;--text:#eef2ff;--muted:#8b9bb4;
  --border:rgba(176,110,243,0.18);--gp:0 0 24px rgba(176,110,243,0.45);
  --gb:0 0 24px rgba(79,158,248,0.45);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 15%,rgba(176,110,243,0.1) 0%,transparent 55%),radial-gradient(ellipse at 85% 85%,rgba(79,158,248,0.08) 0%,transparent 55%);pointer-events:none;z-index:0;}
#app{position:relative;z-index:1;min-height:100vh;}

/* LOADER */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;}
.loader-fruit{font-size:52px;animation:bounce 1s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.loader-text{font-size:1rem;font-weight:700;color:var(--purple);letter-spacing:2px;}
.loader-sub{font-size:0.75rem;font-weight:600;color:var(--muted);}
.loader-bar-wrap{width:220px;height:6px;background:rgba(176,110,243,0.15);border-radius:99px;overflow:hidden;}
.loader-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--purple2),var(--purple),var(--blue2));border-radius:99px;transition:width 0.4s ease;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-glow{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(176,110,243,0.13) 0%,transparent 65%);animation:breathe 4s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:0.5}}
.login-box{position:relative;background:rgba(14,14,40,0.97);border:1.5px solid var(--border);border-radius:24px;padding:48px 40px;max-width:430px;width:100%;text-align:center;box-shadow:var(--gp),0 32px 64px rgba(0,0,0,0.55);}
.login-fruit{font-size:68px;display:block;filter:drop-shadow(0 0 20px rgba(176,110,243,0.9));margin-bottom:10px;}
.login-title{font-family:'Orbitron',sans-serif;font-size:1.8rem;font-weight:900;background:linear-gradient(130deg,var(--purple),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.login-sub{font-size:0.7rem;letter-spacing:4px;color:var(--muted);font-weight:700;margin-top:4px;}
.login-desc{margin:18px 0 26px;color:var(--muted);font-size:1rem;line-height:1.6;}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.divider span{font-size:0.78rem;color:var(--muted);font-weight:700;}
.btn-google{display:flex;align-items:center;gap:10px;justify-content:center;width:100%;padding:14px 20px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.13);border-radius:12px;color:var(--text);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.22s;}
.btn-google:hover{background:rgba(255,255,255,0.11);transform:translateY(-2px);}
.btn-google:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.btn-guest{display:flex;align-items:center;gap:10px;justify-content:center;width:100%;padding:13px 20px;margin-top:10px;background:rgba(176,110,243,0.1);border:1.5px solid rgba(176,110,243,0.3);border-radius:12px;color:var(--purple);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.22s;}
.btn-guest:hover{background:rgba(176,110,243,0.18);transform:translateY(-2px);}
.login-err{margin-top:14px;padding:10px 14px;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);border-radius:9px;color:var(--red);font-size:0.85rem;display:none;}

/* GUEST MODAL */
.overlay-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:900;align-items:center;justify-content:center;padding:20px;}
.overlay-modal.show{display:flex;}
.modal-box{background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:30px;width:100%;max-width:400px;box-shadow:var(--gp);}
.modal-box h3{font-size:1.2rem;font-weight:800;margin-bottom:8px;}
.modal-box p{color:var(--muted);font-size:0.9rem;margin-bottom:18px;line-height:1.6;}
.name-input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.12);border-radius:10px;color:var(--text);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:600;outline:none;transition:border-color 0.2s;margin-bottom:12px;}
.name-input:focus{border-color:var(--purple);}
.name-input::placeholder{color:var(--muted);}
.btn-primary{width:100%;padding:12px;background:linear-gradient(130deg,var(--purple2),var(--purple));border:none;border-radius:10px;color:#fff;font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:800;cursor:pointer;transition:all 0.2s;}
.btn-primary:hover{transform:translateY(-2px);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.btn-x{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;line-height:1;}
.btn-x:hover{color:var(--text);}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:rgba(7,7,26,0.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.topbar-logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1rem;background:linear-gradient(90deg,var(--purple),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;cursor:pointer;letter-spacing:1px;user-select:none;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.t-avatar{width:34px;height:34px;border-radius:50%;border:2px solid var(--purple);object-fit:cover;}
.uname{font-size:0.88rem;font-weight:700;color:var(--muted);display:none;}
@media(min-width:480px){.uname{display:block;}}
.btn-sm{padding:6px 13px;background:transparent;border:1.5px solid var(--border);border-radius:8px;color:var(--muted);font-family:'Nunito',sans-serif;font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
.btn-sm:hover{border-color:var(--purple);color:var(--purple);}

/* NAVBAR */
.navbar{display:flex;align-items:center;gap:4px;padding:8px 22px;background:rgba(7,7,26,0.9);border-bottom:1px solid rgba(176,110,243,0.1);overflow-x:auto;scrollbar-width:none;}
.navbar::-webkit-scrollbar{display:none;}
.nav-btn{padding:6px 14px;border-radius:20px;font-size:0.82rem;font-weight:700;color:var(--muted);cursor:pointer;transition:all 0.2s;white-space:nowrap;border:1.5px solid transparent;position:relative;}
.nav-btn:hover{color:var(--text);background:rgba(176,110,243,0.1);}
.nav-btn.active{color:var(--purple);background:rgba(176,110,243,0.12);border-color:rgba(176,110,243,0.3);}
.nav-btn.is-admin{color:var(--yellow);}
.nav-btn.is-admin.active{background:rgba(251,191,36,0.12);border-color:rgba(251,191,36,0.4);}
.nb-badge{position:absolute;top:1px;right:3px;background:var(--red);color:#fff;border-radius:99px;font-size:0.58rem;font-weight:900;padding:1px 5px;min-width:16px;text-align:center;line-height:1.6;display:none;}
.nb-badge.show{display:block;}

/* MAIN */
.main{max-width:1080px;margin:0 auto;padding:24px 18px;}

/* PROFILE PANEL */
.profile-panel{background:rgba(176,110,243,0.06);border:1.5px solid var(--border);border-radius:18px;padding:16px 20px;margin-bottom:28px;}
.profile-inner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.pr-avatar{width:50px;height:50px;border-radius:50%;border:2px solid var(--purple);object-fit:cover;box-shadow:0 0 12px rgba(176,110,243,0.4);}
.pr-name{font-size:1rem;font-weight:800;color:var(--purple);}
.pr-badge{font-size:0.75rem;color:var(--muted);font-weight:600;margin-top:2px;}
.boat-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;}
.boat-label{font-size:0.9rem;font-weight:700;color:var(--text);}
.switch{position:relative;display:inline-block;width:52px;height:28px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.15);border-radius:28px;transition:0.3s;}
.slider::before{content:'';position:absolute;width:20px;height:20px;left:3px;bottom:3px;background:var(--muted);border-radius:50%;transition:0.3s;}
input:checked+.slider{background:rgba(52,211,153,0.25);border-color:var(--green);}
input:checked+.slider::before{transform:translateX(24px);background:var(--green);box-shadow:0 0 10px var(--green);}
.boat-ind{display:flex;align-items:center;gap:6px;font-size:0.88rem;font-weight:800;padding:5px 12px;border-radius:20px;transition:all 0.3s;}
.boat-ind.on{background:rgba(52,211,153,0.15);color:var(--green);border:1.5px solid rgba(52,211,153,0.35);}
.boat-ind.off{background:rgba(248,113,113,0.12);color:var(--red);border:1.5px solid rgba(248,113,113,0.3);}
.dot{width:8px;height:8px;border-radius:50%;}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.5s ease-in-out infinite;}
.dot.off{background:var(--red);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}

/* HERO */
.hero{text-align:center;margin-bottom:32px;}
.hero-eye{font-size:0.72rem;letter-spacing:5px;color:var(--muted);font-weight:700;margin-bottom:8px;}
.hero-h1{font-family:'Orbitron',sans-serif;font-size:clamp(1.3rem,4vw,2.4rem);font-weight:900;line-height:1.25;}
.grad{background:linear-gradient(90deg,var(--purple),var(--blue2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-tip{margin-top:10px;font-size:0.9rem;color:var(--muted);font-weight:600;}

/* DEST CARDS */
.dest-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;}
.dest-card{position:relative;overflow:hidden;background:rgba(14,14,40,0.9);border:1.5px solid var(--border);border-radius:20px;padding:38px 26px;text-align:center;cursor:pointer;transition:all 0.28s ease;}
.dest-card:hover{transform:translateY(-7px);border-color:var(--purple);box-shadow:var(--gp),0 20px 40px rgba(0,0,0,0.4);}
.dest-card:nth-child(2):hover{border-color:var(--blue);box-shadow:var(--gb),0 20px 40px rgba(0,0,0,0.4);}
.dest-glow{position:absolute;top:-50px;left:50%;transform:translateX(-50%);width:200px;height:200px;background:radial-gradient(circle,rgba(176,110,243,0.12),transparent 70%);pointer-events:none;}
.dest-glow.b{background:radial-gradient(circle,rgba(79,158,248,0.12),transparent 70%);}
.dest-icon{font-size:58px;display:block;margin-bottom:14px;filter:drop-shadow(0 0 14px rgba(176,110,243,0.7));}
.dest-name{font-size:1.2rem;font-weight:900;margin-bottom:6px;}
.dest-desc{font-size:0.85rem;color:var(--muted);margin-bottom:16px;font-weight:600;}
.dest-cta{font-size:0.88rem;font-weight:800;color:var(--purple);display:flex;align-items:center;justify-content:center;gap:6px;}
.dest-card:nth-child(2) .dest-cta{color:var(--blue);}

/* PAGE HEADER */
.pg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.pg-title{font-family:'Orbitron',sans-serif;font-size:1.25rem;font-weight:900;color:var(--purple);letter-spacing:1px;}
.btn-back{padding:8px 14px;background:transparent;border:1.5px solid var(--border);border-radius:9px;color:var(--muted);font-family:'Nunito',sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
.btn-back:hover{border-color:var(--purple);color:var(--purple);}
.btn-create{padding:10px 20px;background:linear-gradient(130deg,var(--purple2),var(--purple));border:none;border-radius:10px;color:#fff;font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:800;cursor:pointer;transition:all 0.25s;box-shadow:0 0 18px rgba(176,110,243,0.4);}
.btn-create:hover{transform:translateY(-2px);}
.btn-create:disabled{opacity:0.6;cursor:not-allowed;transform:none;}

/* ROOMS */
.room-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:15px;min-height:120px;}
.room-card{background:rgba(14,14,40,0.94);border:1.5px solid var(--border);border-radius:16px;padding:18px;cursor:pointer;transition:border-color 0.25s,box-shadow 0.25s,transform 0.25s;}
.room-card:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:var(--gb);}
.room-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.room-host{font-size:0.95rem;font-weight:800;}
.timer-pill{font-size:0.7rem;font-weight:800;color:var(--blue2);background:rgba(34,211,238,0.1);border:1px solid rgba(34,211,238,0.3);padding:3px 9px;border-radius:20px;}
.room-stats{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.room-count{font-size:0.85rem;color:var(--muted);font-weight:600;}
.room-count.full{color:var(--red);font-weight:800;}
.room-beast{font-size:0.82rem;font-weight:800;}
.room-beast.yes{color:var(--green);}
.room-beast.no{color:var(--red);}
.btn-join{width:100%;padding:9px;background:linear-gradient(90deg,var(--blue2),var(--blue));border:none;border-radius:9px;color:#fff;font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:800;cursor:pointer;transition:all 0.18s;}
.btn-join:hover{opacity:0.85;transform:translateY(-1px);}
.btn-join.full{background:rgba(255,255,255,0.07);color:var(--muted);cursor:not-allowed;transform:none;}
.empty-msg{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 20px;border:1.5px dashed var(--border);border-radius:16px;font-size:0.95rem;font-weight:600;}

/* ROOM VIEW */
.room-layout{display:grid;grid-template-columns:1fr;gap:18px;}
@media(min-width:768px){.room-layout{grid-template-columns:1fr 360px;align-items:start;}}
.room-title-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
.room-h2{font-family:'Orbitron',sans-serif;font-size:1.25rem;font-weight:900;color:var(--purple);text-shadow:0 0 16px rgba(176,110,243,0.65);}
.room-timer-pill{font-size:0.82rem;font-weight:800;color:var(--blue2);background:rgba(34,211,238,0.1);border:1px solid rgba(34,211,238,0.3);padding:6px 14px;border-radius:20px;}
.beast-banner{padding:11px 16px;border-radius:11px;font-size:0.85rem;font-weight:800;text-align:center;margin-bottom:16px;}
.beast-banner.yes{background:rgba(52,211,153,0.1);border:1.5px solid rgba(52,211,153,0.4);color:var(--green);}
.beast-banner.no{background:rgba(248,113,113,0.1);border:1.5px solid rgba(248,113,113,0.35);color:var(--red);}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;}
.p-chip{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);border-radius:10px;padding:9px 11px;font-size:0.84rem;font-weight:700;}
.p-chip.me{border-color:var(--purple);background:rgba(176,110,243,0.09);}
.p-chip.empty{border-style:dashed;color:rgba(255,255,255,0.18);font-size:0.78rem;justify-content:center;}
.p-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.p-boat{font-size:0.95rem;flex-shrink:0;}
.p-boat.yes{filter:drop-shadow(0 0 5px rgba(52,211,153,0.9));}
.p-boat.no{opacity:0.3;}

/* CHAT (room) */
.chat-panel{background:rgba(14,14,40,0.95);border:1.5px solid var(--border);border-radius:18px;display:flex;flex-direction:column;height:490px;}
.chat-head{padding:13px 16px;font-size:0.88rem;font-weight:800;color:var(--purple);border-bottom:1px solid var(--border);flex-shrink:0;}
.chat-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:rgba(176,110,243,0.35) transparent;}
.msg{display:flex;flex-direction:column;gap:3px;max-width:86%;}
.msg.me{align-self:flex-end;align-items:flex-end;}
.msg.other{align-self:flex-start;align-items:flex-start;}
.msg-who{font-size:0.68rem;color:var(--muted);font-weight:700;margin:0 4px;}
.msg-txt{padding:8px 13px;border-radius:12px;font-size:0.9rem;line-height:1.45;word-break:break-word;font-weight:600;}
.msg.me .msg-txt{background:linear-gradient(130deg,var(--purple2),var(--purple));color:#fff;}
.msg.other .msg-txt{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.07);}
.chat-foot{display:flex;gap:8px;padding:11px;border-top:1px solid var(--border);flex-shrink:0;}
.chat-input{flex:1;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:9px 13px;color:var(--text);font-family:'Nunito',sans-serif;font-size:0.93rem;font-weight:600;outline:none;transition:border-color 0.2s;}
.chat-input:focus{border-color:var(--purple);}
.chat-input::placeholder{color:var(--muted);}
.btn-send{padding:9px 16px;background:linear-gradient(130deg,var(--purple2),var(--purple));border:none;border-radius:10px;color:#fff;font-size:1rem;cursor:pointer;transition:all 0.18s;}
.btn-send:hover{opacity:0.85;transform:scale(1.05);}

/* ══════════════════════════════════════
   TRADE PAGE
   KEY FIX: NO animation on trade cards
   Grid is the ONLY layout mechanism
══════════════════════════════════════ */
.sec-title{font-family:'Orbitron',sans-serif;font-size:1.05rem;font-weight:900;color:var(--purple);letter-spacing:1px;margin-bottom:6px;}
.sec-desc{color:var(--muted);font-size:0.87rem;line-height:1.7;font-weight:600;margin-bottom:16px;}

/* Trade form */
.trade-form-wrap{background:rgba(14,14,40,0.92);border:1.5px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:22px;}
.tfw-title{font-size:0.82rem;font-weight:800;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;}
.trade-sides{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
@media(max-width:500px){.trade-sides{grid-template-columns:1fr;}}
.ts-label{font-size:0.7rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
.ts-label.want{color:var(--blue2);}
.ts-label.offer{color:var(--green);}
.slots-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.slot{background:rgba(255,255,255,0.03);border:1.5px dashed rgba(255,255,255,0.1);border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:border-color 0.2s,background 0.2s;position:relative;overflow:hidden;}
.slot:hover{border-color:var(--purple);background:rgba(176,110,243,0.07);}
.slot .s-plus{font-size:1.8rem;color:rgba(176,110,243,0.45);line-height:1;}
.slot:hover .s-plus{color:var(--purple);}
.slot.filled{border-style:solid;border-color:rgba(176,110,243,0.4);background:rgba(176,110,243,0.07);}
.slot img{width:44px;height:44px;object-fit:contain;}
.slot .s-name{font-size:0.6rem;font-weight:800;color:var(--text);text-align:center;line-height:1.2;padding:0 4px;}
.slot .s-rm{position:absolute;top:3px;right:3px;font-size:0.58rem;color:var(--red);cursor:pointer;background:rgba(248,113,113,0.15);border-radius:4px;padding:1px 5px;line-height:1.5;}
.btn-post-trade{width:100%;padding:11px;background:linear-gradient(130deg,var(--purple2),var(--purple));border:none;border-radius:10px;color:#fff;font-family:'Nunito',sans-serif;font-size:0.9rem;font-weight:800;cursor:pointer;transition:all 0.22s;box-shadow:0 0 16px rgba(176,110,243,0.3);}

/*
 * THE KEY FIX FOR TRADE CARD OVERLAP:
 *
 * 1. display:grid with fixed columns — browser MUST calculate all
 *    positions simultaneously before painting. No absolute/float.
 * 2. align-items:start — each card is only as tall as its own content.
 *    Without this, all cards in a row stretch to tallest card height,
 *    which can cause visual stacking if heights differ mid-animation.
 * 3. NO animation property on .trade-card at all.
 *    Even opacity:0→1 causes a brief frame where the grid hasn't
 *    painted positions yet, making all cards appear at (0,0).
 * 4. position:relative on each card ensures its stacking context
 *    is confined to its grid cell.
 */
.trade-list{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  align-items:start;
  /* NO animation here or on children */
}
@media(max-width:860px){.trade-list{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:520px){.trade-list{grid-template-columns:minmax(0,1fr);}}

.trade-card{
  position:relative;           /* stacking context within grid cell only */
  background:rgba(12,12,32,0.96);
  border:1.5px solid rgba(176,110,243,0.14);
  border-radius:14px;
  padding:13px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:9px;
  /* NO animation — prevents all overlap issues */
  transition:border-color 0.22s,box-shadow 0.22s;
}
.trade-card:hover{border-color:rgba(176,110,243,0.5);box-shadow:0 4px 20px rgba(176,110,243,0.15);}

const rc  = r => (r||"common").toLowerCase().replace(/\s/g,"");

/* ── AUTH ── */
window.loginWithGoogle = async () => {
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("loginErr");
  if (btn) btn.disabled = true;
  if (err) err.style.display = "none";
  try { await signInWithPopup(auth, provider); }
  catch(e) {
    if (btn) btn.disabled = false;
    if (err) {
      err.style.display = "block";
      err.textContent = e.code === "auth/popup-blocked" ? "⚠️ Allow popups for this site."
        : e.code === "auth/popup-closed-by-user" ? "Sign-in cancelled. Try again!"
        : e.code === "auth/unauthorized-domain" ? "Domain not authorised in Firebase."
        : "Sign-in failed: " + e.code;
    }
  }
};

window.showGuestModal = () => { document.getElementById("guestModal").classList.add("show"); setTimeout(()=>document.getElementById("guestName")?.focus(),100); };
window.confirmGuest = () => {
  const inp = document.getElementById("guestName");
  const name = inp?.value.trim();
  if (!name || name.length < 2) { inp.style.borderColor = "var(--red)"; return; }
  closeModal("guestModal");
  isGuest = true;
  CU = { uid:"guest_"+Math.random().toString(36).slice(2,9), displayName:name, photoURL:"https://api.dicebear.com/7.x/bottts/svg?seed="+encodeURIComponent(name) };
  myBoat = false;
  go("home");
};

window.logOut = async () => {
  killAll();
  if (isGuest) { isGuest=false; CU=null; myBoat=false; go("login"); }
  else await signOut(auth);
};

let authDone = false;
const authTimer = setTimeout(()=>{ if(!authDone&&!isGuest) go("login"); }, 8000);

onAuthStateChanged(auth, async user => {
  if (isGuest) return;
  authDone = true;
  clearTimeout(authTimer);
  CU = user;
  if (user) {
    ldrStep(75,"Loading profile...");
    const uRef = ref(db,"users/"+user.uid);
    try {
      const snap = await get(uRef);
      if (!snap.exists()) await set(uRef,{uid:user.uid,name:user.displayName,photo:user.photoURL,hasBeastBoat:false});
      myBoat = (snap.exists() ? snap.val().hasBeastBoat : false) === true;
    } catch(e) { myBoat = false; }
    ldrStep(100,"Done! 🍊");
    setTimeout(()=>{ go("home"); startBadgeListener(); }, 300);
  } else {
    ldrStep(100,"Ready!");
    setTimeout(()=>go("login"), 200);
  }
}, ()=>{ authDone=true; clearTimeout(authTimer); go("login"); });

/* ── KILL LISTENERS ── */
function killListeners() {
  if (L_rooms)    { off(L_rooms);    L_rooms    = null; }
  if (L_roomDoc)  { off(L_roomDoc);  L_roomDoc  = null; }
  if (L_roomChat) { off(L_roomChat); L_roomChat = null; }
  if (L_trades)   { off(L_trades);   L_trades   = null; }
  if (L_fruits)   { off(L_fruits);   L_fruits   = null; }
  if (L_inboxMeta){ off(L_inboxMeta);L_inboxMeta= null; }
  /* NOTE: L_convMsgs is NOT killed here — it must survive navigation
     within the inbox page. It is killed only in killAll() or when
     a different conversation is opened. */
  if (roomTimer)  { clearInterval(roomTimer); roomTimer = null; }
}
function killConvListener() {
  if (L_convMsgs) { off(L_convMsgs); L_convMsgs = null; }
  activeConvId = null;
}
function killAll() {
  killListeners();
  killConvListener();
  if (L_badge) { off(L_badge); L_badge = null; }
}

/* ── BADGE LISTENER ── */
function startBadgeListener() {
  if (!CU || isGuest) return;
  const r = ref(db,"inboxMeta/"+CU.uid);
  L_badge = r;
  onValue(r, snap => {
    let total = 0;
    if (snap.exists()) snap.forEach(c=>total+=(c.val().unread||0));
    globalUnread = total;
    refreshBadge();
  });
}
function refreshBadge() {
  const el = document.getElementById("inboxBadge");
  if (!el) return;
  el.textContent = globalUnread > 9 ? "9+" : String(globalUnread);
  el.className = "nb-badge" + (globalUnread > 0 ? " show" : "");
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ROOMS (unchanged)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function listenRooms(dest) {
  const r = ref(db,"rooms"); L_rooms = r;
  onValue(r, snap => {
    const now = Date.now(), rooms = [];
    if (snap.exists()) snap.forEach(c => {
      const rm = {id:c.key,...c.val()};
      if (rm.expiresAt && rm.expiresAt < now) { remove(ref(db,"rooms/"+c.key)); return; }
      if (rm.destination === dest) rooms.push(rm);
    });
    renderRoomList(rooms);
  });
}

function renderRoomList(rooms) {
  const el = document.getElementById("roomList"); if (!el) return;
  if (!rooms.length) { el.innerHTML=`<div class="empty-msg">😴 No rooms yet! Hit ✨ Create Room to start the hunt!</div>`; return; }
  el.innerHTML = rooms.map(r => {
    const pl = r.players?Object.values(r.players):[];
    const hb = pl.some(p=>p.hasBeastBoat===true), full = pl.length>=7;
    const rem = r.expiresAt?Math.max(0,r.expiresAt-Date.now()):0;
    return `<div class="room-card" onclick="enterRoom('${r.id}')">
      <div class="room-head"><span class="room-host">👑 ${esc(r.host||"Unknown")}</span><span class="timer-pill">⏱ ${Math.floor(rem/60000)}m ${Math.floor((rem%60000)/1000)}s</span></div>
      <div class="room-stats"><span class="room-count ${full?"full":""}">👥 ${pl.length}/7</span><span class="room-beast ${hb?"yes":"no"}">${hb?"🚢 Beast Hunter Available!":"❌ No Beast Hunter"}</span></div>
      <button class="btn-join ${full?"full":""}" onclick="event.stopPropagation();joinRoom('${r.id}')">${full?"Room Full 😔":"Join Room →"}</button>
    </div>`;
  }).join("");
}

window.createRoom = async () => {
  if (!CU || !currentDest) return;
  const btn = document.querySelector(".btn-create");
  if (btn) { btn.disabled=true; btn.textContent="Creating..."; }
  const now = Date.now(), rid = push(ref(db,"rooms")).key;
  try {
    await set(ref(db,"rooms/"+rid),{destination:currentDest,host:CU.displayName,hostUid:CU.uid,createdAt:now,expiresAt:now+3600000,
      players:{[CU.uid]:{uid:CU.uid,name:CU.displayName,hasBeastBoat:myBoat===true}}});
    enterRoom(rid);
  } catch(e) { alert("❌ Couldn't create room!\n"+e.message); if(btn){btn.disabled=false;btn.textContent="✨ Create Room";} }
};

window.joinRoom = async rid => {
  try {
    const snap = await get(ref(db,"rooms/"+rid)); if (!snap.exists()){alert("Room doesn't exist!");return;}
    const r = snap.val(), pl = r.players?Object.values(r.players):[];
    if (pl.length>=7){alert("😔 Room is full!");return;}
    if (r.players&&r.players[CU.uid]){enterRoom(rid);return;}
    await update(ref(db,"rooms/"+rid+"/players"),{[CU.uid]:{uid:CU.uid,name:CU.displayName,hasBeastBoat:myBoat===true}});
    enterRoom(rid);
  } catch(e){alert("Couldn't join room. Try again!");}
};

window.leaveRoom = async () => {
  if (!currentRoom) return;
  try {
    await remove(ref(db,"rooms/"+currentRoom+"/players/"+CU.uid));
    const snap = await get(ref(db,"rooms/"+currentRoom+"/players"));
    if (!snap.exists()||!Object.keys(snap.val()||{}).length) await remove(ref(db,"rooms/"+currentRoom));
  } catch(e) {}
  killListeners(); currentRoom=null; go("destination"); listenRooms(currentDest);
};

window.enterRoom = rid => { killListeners(); currentRoom=rid; go("room"); listenRoomDoc(rid); listenRoomChat(rid); };

function listenRoomDoc(rid) {
  const r = ref(db,"rooms/"+rid); L_roomDoc = r;
  let last = null;
  onValue(r, snap => {
    if (!snap.exists()){window.goDestination(currentDest);return;}
    const rm = {id:rid,...snap.val()};
    if (rm.expiresAt&&rm.expiresAt<Date.now()){remove(r);window.goDestination(currentDest);return;}
    last=rm; renderRoomView(rm);
  });
  if (roomTimer) clearInterval(roomTimer);
  roomTimer = setInterval(()=>{
    if (!last) return;
    const pill = document.getElementById("rTimerPill"); if(!pill){clearInterval(roomTimer);return;}
    const rem = last.expiresAt?Math.max(0,last.expiresAt-Date.now()):0;
    if (!rem){remove(ref(db,"rooms/"+rid));window.goDestination(currentDest);return;}
    pill.textContent=`⏱ ${Math.floor(rem/60000)}:${String(Math.floor((rem%60000)/1000)).padStart(2,"0")}`;
  },1000);
}

function renderRoomView(r) {
  const pl=r.players?Object.values(r.players):[], hb=pl.some(p=>p.hasBeastBoat===true);
  const rem=r.expiresAt?Math.max(0,r.expiresAt-Date.now()):0;
  const el=document.getElementById("roomContent"); if(!el)return;
  el.innerHTML=`<div class="room-title-row"><h2 class="room-h2">📍 ${esc(r.destination)}</h2><span class="room-timer-pill" id="rTimerPill">⏱ ${Math.floor(rem/60000)}:${String(Math.floor((rem%60000)/1000)).padStart(2,"0")}</span></div>
    <div class="beast-banner ${hb?"yes":"no"}">${hb?"🚢 BEAST HUNTER IS HERE! You're all set!":"❌ No Beast Hunter yet!"}</div>
    <div class="player-grid">
      ${pl.map(p=>`<div class="p-chip ${p.uid===CU?.uid?"me":""}"><span class="p-name">${p.uid===CU?.uid?"⭐ You":esc(p.name)}</span><span class="p-boat ${p.hasBeastBoat?"yes":"no"}">${p.hasBeastBoat?"🚢":"🚫"}</span></div>`).join("")}
      ${Array(Math.max(0,7-pl.length)).fill(0).map(()=>`<div class="p-chip empty">Waiting...</div>`).join("")}
    </div>`;
}

function listenRoomChat(rid) {
  const r = ref(db,"chat/"+rid); L_roomChat = r;
  onValue(r, snap => {
    const box = document.getElementById("chatBox"); if(!box) return;
    const msgs=[]; if(snap.exists()) snap.forEach(c=>msgs.push({id:c.key,...c.val()}));
    box.innerHTML = msgs.map(m=>{const me=m.uid===CU?.uid;
      return`<div class="msg ${me?"me":"other"}"><span class="msg-who">${me?"You":esc(m.name)}</span><span class="msg-txt">${esc(m.text)}</span></div>`;
    }).join("");
    box.scrollTop=box.scrollHeight;
  });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   FRUITS — load once, reuse everywhere
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
let fruitsReady = false;
let fruitsCallbacks = [];

function loadFruitsAndTrades() {
  /* Load fruits first, then attach trades listener */
  const r = ref(db,"fruits"); L_fruits = r;
  onValue(r, snap => {
    fruitsCache = {};
    if (snap.exists()) snap.forEach(c=>fruitsCache[c.key]={id:c.key,...c.val()});
    if (!fruitsReady) {
      fruitsReady = true;
      fruitsCallbacks.forEach(fn=>fn());
      fruitsCallbacks = [];
      /* Now safe to attach trades listener */
      listenTrades();
    } else {
      /* Fruits updated — re-render current trade list */
      renderTradeList(tradesCache);
    }
  });
}

function onFruitsReady(fn) {
  if (fruitsReady) fn(); else fruitsCallbacks.push(fn);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TRADES
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function listenTrades() {
  const r = ref(db,"trades"); L_trades = r;
  onValue(r, snap => {
    tradesCache = [];
    if (snap.exists()) snap.forEach(c=>tradesCache.push({id:c.key,...c.val()}));
    tradesCache.sort((a,b)=>(b.ts||0)-(a.ts||0));
    renderTradeList(tradesCache);
  });
}

function renderTradeList(trades) {
  const el = document.getElementById("tradeList"); if (!el) return;

  if (!trades.length) {
    el.innerHTML=`<div class="empty-msg" style="grid-column:1/-1">🤝 No trades posted yet! Post one above.</div>`;
    return;
  }

  /*
   * BUILD ALL HTML IN ONE STRING then assign once.
   * This is critical: innerHTML assignment triggers one layout pass.
   * If we append cards one by one, each append triggers a layout,
   * and during the next append the previous card may not have its
   * final grid position yet → visual stacking.
   */
  const html = trades.map(t => {
    const wi = t.wants  ? Object.values(t.wants)  : [];
    const oi = t.offers ? Object.values(t.offers) : [];
    const isOwn = CU && t.uid === CU.uid;
    const canDel = CU && (isOwn || isAdmin());

    const tileHtml = (ids) => [0,1,2,3].map(i => {
      const fid = ids[i]; if (!fid) return `<div class="tc-fruit-tile empty-tile"></div>`;
      const f = fruitsCache[fid];
      if (!f) return `<div class="tc-fruit-tile has-fruit"><span style="font-size:0.6rem;color:var(--muted)">?</span></div>`;
      return `<div class="tc-fruit-tile has-fruit r-${rc(f.rarity)}">
        <img src="${esc(f.photo||"")}" alt="${esc(f.name)}" onerror="this.src='${fallbackImg()}'"/>
        <span class="tc-fruit-name">${esc(f.name)}</span>
      </div>`;
    }).join("");

    return `<div class="trade-card" onclick="openTradeDetail('${t.id}')">
      <div class="tc-top">
        <span class="tc-poster">👤 ${esc(t.name)}${isOwn?` <span style="opacity:0.45;font-size:0.62rem">(you)</span>`:""}</span>
        <span class="tc-age">${ago(t.ts)}</span>
      </div>
      <div class="tc-body">
        <div><div class="tc-side-tag want">Wants</div><div class="tc-fruit-grid">${tileHtml(wi)}</div></div>
        <div class="tc-arrow">⇄</div>
        <div><div class="tc-side-tag offer">Offers</div><div class="tc-fruit-grid">${tileHtml(oi)}</div></div>
      </div>
      <div class="tc-footer">
        ${canDel
          ? `<button class="btn-tc-del" onclick="event.stopPropagation();deleteTrade('${t.id}')">🗑 Remove</button>`
          : `<span class="tc-tap-hint">tap to message →</span>`
        }
      </div>
    </div>`;
  }).join("");

  /* Single DOM write — no flash, no overlap */
  el.innerHTML = html;
}

window.postTrade = async () => {
  if (!CU) { alert("Please sign in to post a trade!"); return; }
  const wl = tradeWants.filter(Boolean), ol = tradeOffers.filter(Boolean);
  if (!wl.length && !ol.length) { alert("Add at least one fruit to either side!"); return; }
  const btn = document.getElementById("postBtn"); if (btn) btn.disabled = true;
  try {
    const tid = push(ref(db,"trades")).key, wo={}, oo={};
    wl.forEach((id,i)=>wo[i]=id); ol.forEach((id,i)=>oo[i]=id);
    await set(ref(db,"trades/"+tid),{uid:CU.uid,name:CU.displayName,wants:wo,offers:oo,ts:Date.now(),status:"open"});
    tradeWants=[null,null,null,null]; tradeOffers=[null,null,null,null];
    refreshSlots();
  } catch(e){alert("Couldn't post trade. Try again!");}
  if (btn) btn.disabled = false;
};

window.deleteTrade = async tid => {
  if (!confirm("Delete this trade?")) return;
  try { await remove(ref(db,"trades/"+tid)); } catch(e){}
};

window.openTradeDetail = async tid => {
  try {
    const snap = await get(ref(db,"trades/"+tid));
    if (!snap.exists()) { alert("Trade no longer exists!"); return; }
    const t = {id:tid,...snap.val()};
    const wi = t.wants?Object.values(t.wants):[], oi = t.offers?Object.values(t.offers):[];
    const isOwn = CU && t.uid === CU.uid;
    const canDel = CU && (isOwn || isAdmin());

    const mkFruits = ids => ids.length ? ids.map(id=>{
      const f = fruitsCache[id];
      if (!f) return`<div class="td-fruit"><span style="font-size:0.78rem;color:var(--muted)">Unknown</span></div>`;
      return`<div class="td-fruit"><img src="${esc(f.photo||"")}" alt="${esc(f.name)}" onerror="this.src='${fallbackImg()}'"/>
        <div><div class="td-fn">${esc(f.name)}</div><div class="td-fv"><span class="rp rp-${rc(f.rarity)}">${f.rarity||"?"}</span> 💰 ${Number(f.value||0).toLocaleString()}</div></div></div>`;
    }).join("") : `<div style="color:var(--muted);font-size:0.82rem;font-weight:600;padding:6px 0;">Anything / Negotiable</div>`;

    document.getElementById("tradeDetailBody").innerHTML=`
      <div class="td-poster"><div class="td-av">👤</div><div><div class="td-name">${esc(t.name)}</div><div class="td-time">Posted ${ago(t.ts)}</div></div></div>
      <div class="td-sides">
        <div class="td-side"><h4 class="want">🔵 WANTS</h4><div class="td-fruits">${mkFruits(wi)}</div></div>
        <div class="td-side"><h4 class="offer">🟢 OFFERS</h4><div class="td-fruits">${mkFruits(oi)}</div></div>
      </div>
      <div class="td-actions">
        ${isOwn
          ? `<button class="btn-inq" onclick="closeModal('tradeDetailModal');goInbox('${t.id}')">📬 View Inquiries</button>`
          : (CU&&!isGuest
            ? `<button class="btn-msg" onclick="startConv('${t.id}','${esc(t.uid)}','${esc(t.name)}')">💬 Message ${esc(t.name)}</button>`
            : `<p style="text-align:center;color:var(--muted);font-size:0.85rem;font-weight:600;">🔒 Sign in to message</p>`)
        }
        ${canDel?`<button class="btn-del-full" onclick="deleteTrade('${t.id}');closeModal('tradeDetailModal')">🗑 Remove Listing</button>`:""}
      </div>`;
    document.getElementById("tradeDetailModal").classList.add("show");
  } catch(e){alert("Couldn't load trade. Try again!");}
};

/* ── FRUIT SLOTS ── */
let tradeWants  = [null,null,null,null];
let tradeOffers = [null,null,null,null];

window.openPicker = (side, idx) => {
  pickerCtx = {side, idx};
  const grid = document.getElementById("fpGrid");
  const fruits = Object.values(fruitsCache).sort((a,b)=>({Mythical:0,Legendary:1,Rare:2,Uncommon:3,Common:4}[a.rarity]??5)-({Mythical:0,Legendary:1,Rare:2,Uncommon:3,Common:4}[b.rarity]??5));
  if (!fruits.length) { grid.innerHTML=`<div class="no-fruits">No fruits yet — admin needs to add some!</div>`; }
  else grid.innerHTML = fruits.map(f=>`
    <div class="fpicker-item fpr-${rc(f.rarity)}" onclick="pickFruit('${f.id}')">
      <img src="${esc(f.photo||"")}" alt="${esc(f.name)}" onerror="this.src='${fallbackImg()}'"/>
      <div class="fi-name">${esc(f.name)}</div>
      <span class="rp rp-${rc(f.rarity)}">${f.rarity||"?"}</span>
    </div>`).join("");
  document.getElementById("fruitPicker").classList.add("show");
};

window.pickFruit = id => {
  if (!pickerCtx) return;
  const {side,idx} = pickerCtx;
  if (side==="want") tradeWants[idx]=id; else tradeOffers[idx]=id;
  closeModal("fruitPicker");
  refreshSlots();
};

window.rmSlot = (side,idx,e) => {
  e.stopPropagation();
  if (side==="want") tradeWants[idx]=null; else tradeOffers[idx]=null;
  refreshSlots();
};

function refreshSlots() {
  ["want","offer"].forEach(side => {
    const arr = side==="want"?tradeWants:tradeOffers;
    for (let i=0;i<4;i++) {
      const el = document.getElementById(`sl-${side}-${i}`); if(!el) continue;
      const fid = arr[i];
      if (fid && fruitsCache[fid]) {
        const f = fruitsCache[fid];
        el.className=`slot filled r-${rc(f.rarity)}`;

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   INBOX — Private DM System

   ROOT CAUSE OF "only first message shows":
   The previous code stored the conversation
   messages listener in the same variable as
   other listeners, so when killListeners()
   was called (e.g. switching conversations
   in the sidebar), it killed the message
   listener too. The UI showed the first
   batch of messages from the initial
   onValue() call, but subsequent messages
   triggered onValue() again with no handler.

   FIX: L_convMsgs is a dedicated variable.
   It is ONLY killed by killConvListener()
   which is called only when:
   1. The user leaves the inbox page entirely
   2. The user clicks a DIFFERENT conversation
   NOT when the inbox sidebar updates.
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function startInboxListener() {
  const r = ref(db,"inboxMeta/"+CU.uid); L_inboxMeta = r;
  onValue(r, snap => {
    let convs = [];
    if (snap.exists()) snap.forEach(c=>convs.push({id:c.key,...c.val()}));
    convs.sort((a,b)=>(b.lastTs||0)-(a.lastTs||0));
    if (inboxTradeFilter) convs = convs.filter(c=>c.tradeId===inboxTradeFilter);
    renderConvSidebar(convs);
    /* Auto-open if a convId was pre-selected */
    if (activeConvId) {
      const found = convs.find(c=>c.id===activeConvId);
      if (found) openConv(found);
    }
  });
}

function renderConvSidebar(convs) {
  const el = document.getElementById("inboxList"); if (!el) return;
  if (!convs.length) {
    el.innerHTML=`<div class="inbox-empty-sidebar">📭 No conversations yet.<br/>Click a trade listing and tap "Message Trader" to start!</div>`;
    return;
  }
  el.innerHTML = convs.map(c=>{
    const unread = c.unread||0;
    const isAct = activeConvId===c.id;
    return `<div class="inbox-item ${isAct?"active":""}" id="ci-${c.id}" onclick="selectConv('${c.id}')">
      <div class="inbox-ava">👤</div>
      <div class="inbox-info">
        <div class="inbox-name">${esc(c.otherName||"Trader")}</div>
        <div class="inbox-prev">${c.lastMsg?esc(c.lastMsg):"No messages yet"}</div>
      </div>
      ${unread>0?`<div class="inbox-badge">${unread>9?"9+":unread}</div>`:""}
    </div>`;
  }).join("");
}

window.selectConv = async id => {
  /* If clicking the same conversation — do nothing */
  if (id === activeConvId) return;

  /* Kill ONLY the previous conversation messages listener */
  killConvListener();
  activeConvId = id;

  /* Update sidebar active state */
  document.querySelectorAll(".inbox-item").forEach(el=>{
    el.classList.toggle("active", el.id==="ci-"+id);
  });

  /* Mark as read */
  try { await update(ref(db,"inboxMeta/"+CU.uid+"/"+id),{unread:0}); } catch(e){}

  /* Get metadata */
  const snap = await get(ref(db,"inboxMeta/"+CU.uid+"/"+id));
  if (!snap.exists()) return;
  openConv({id,...snap.val()});
};

function openConv(meta) {
  const area = document.getElementById("inboxConvArea"); if (!area) return;

  /* Render conversation UI */
  area.innerHTML=`
    <div class="inbox-conv-head">
      <div class="inbox-conv-name">👤 ${esc(meta.otherName||"Trader")}</div>
      <div class="inbox-conv-sub">${meta.myRole==="poster"?"Interested in your trade listing":"Trade conversation"}</div>
    </div>
    <div class="inbox-msgs" id="inboxMsgs"></div>
    <div class="inbox-input-row">
      <input id="inboxInput" class="chat-input" placeholder="Type a message..." onkeypress="inboxMsgKey(event)"/>
      <button class="btn-send" onclick="sendInboxMsg()">➤</button>
    </div>`;

  /* Attach DEDICATED conversation messages listener.
     This listener is stored in L_convMsgs and is
     NOT affected by killListeners(). */
  const msgsRef = ref(db,"conversations/"+meta.id+"/messages");
  L_convMsgs = msgsRef;

  onValue(msgsRef, snap => {
    const box = document.getElementById("inboxMsgs"); if (!box) return;
    const msgs = [];
    if (snap.exists()) snap.forEach(c=>msgs.push({id:c.key,...c.val()}));
    msgs.sort((a,b)=>(a.ts||0)-(b.ts||0));

    if (!msgs.length) {
      box.innerHTML=`<div style="text-align:center;color:var(--muted);padding:28px;font-size:0.85rem;font-weight:600;">No messages yet — say hi! 👋</div>`;
      return;
    }

    box.innerHTML = msgs.map(m=>{
      const me = m.uid===CU?.uid;
      return `<div class="msg ${me?"me":"other"}">
        <span class="msg-who">${me?"You":esc(m.name)}</span>
        <span class="msg-txt">${esc(m.text)}</span>
      </div>`;
    }).join("");

    /* Always scroll to bottom after render */
    requestAnimationFrame(()=>{ box.scrollTop=box.scrollHeight; });

    /* Auto-clear unread when actively viewing */
    if (activeConvId === meta.id) {
      update(ref(db,"inboxMeta/"+CU.uid+"/"+meta.id),{unread:0}).catch(()=>{});
    }
  });

  setTimeout(()=>document.getElementById("inboxInput")?.focus(),100);
}

window.sendInboxMsg = async () => {
  if (!CU || !activeConvId) return;
  const inp = document.getElementById("inboxInput"), text = inp?.value.trim();
  if (!text) return;
  inp.value = "";

  const now = Date.now();
  try {
    /* 1. Save message to conversations/{convId}/messages */
    const mr = push(ref(db,"conversations/"+activeConvId+"/messages"));
    await set(mr, {uid:CU.uid, name:CU.displayName, text, ts:now});

    /* 2. Update my inboxMeta */
    await update(ref(db,"inboxMeta/"+CU.uid+"/"+activeConvId),{lastMsg:text,lastTs:now});

    /* 3. Update other party's inboxMeta with unread++ */
    const myMeta = await get(ref(db,"inboxMeta/"+CU.uid+"/"+activeConvId));
    if (myMeta.exists()) {
      const otherUid = myMeta.val().otherUid;
      if (otherUid) {
        const otherRef = ref(db,"inboxMeta/"+otherUid+"/"+activeConvId);
        const otherSnap = await get(otherRef);
        const cur = otherSnap.exists() ? (otherSnap.val().unread||0) : 0;
        await update(otherRef,{lastMsg:text,lastTs:now,unread:cur+1});
      }
    }
  } catch(e){ console.error("[INBOX] Send failed:",e.message); }
};

window.inboxMsgKey = e=>{ if(e.key==="Enter") window.sendInboxMsg(); };

/* Start conversation from trade detail */
window.startConv = async (tradeId, posterUid, posterName) => {
  if (!CU||isGuest){alert("Sign in to message traders!");return;}
  if (CU.uid===posterUid){closeModal("tradeDetailModal");goInbox(tradeId);return;}
  const convId = tradeId+"_"+CU.uid;
  const now = Date.now();
  try {
    const myRef = ref(db,"inboxMeta/"+CU.uid+"/"+convId);
    if (!(await get(myRef)).exists()) {
      await set(myRef,{convId,tradeId,otherUid:posterUid,otherName:posterName,myRole:"buyer",lastMsg:"",lastTs:now,unread:0});
    }
    const posterRef = ref(db,"inboxMeta/"+posterUid+"/"+convId);
    if (!(await get(posterRef)).exists()) {
      await set(posterRef,{convId,tradeId,otherUid:CU.uid,otherName:CU.displayName,myRole:"poster",lastMsg:"",lastTs:now,unread:0});
    }
  } catch(e){ console.error("[INBOX] Setup failed:",e.message); }
  closeModal("tradeDetailModal");
  goInbox(null, convId);
};
