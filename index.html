<!DOCTYPE html>
<!--
  ============================================================================
  RENTAFRUIT — Blox Fruits Trading Board
  ============================================================================
  SETUP (do this once, then never touch the code again):

  1. Create a Firebase project  →  https://console.firebase.google.com/
  2. In your project: Build → Firestore Database → Create database
     (start in "production mode", pick any region)
  3. In your project: Build → Authentication → Sign-in method → enable
     "Anonymous" (lets any visitor post/offer without a password) AND
     "Google" (only needed for the admin account below).
  4. Firestore → Rules → paste this, then click Publish:

     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {

         function isAdmin() {
           return request.auth != null &&
                  request.auth.token.email == 'jakelordclash@gmail.com' &&
                  request.auth.token.email_verified == true;
         }

         match /trades/{tradeId} {
           allow read: if true;
           allow create: if request.auth != null
                         && request.resource.data.ownerId == request.auth.uid;
           allow update: if request.auth != null
                         && (request.auth.uid == resource.data.ownerId || isAdmin());
           allow delete: if isAdmin();
         }
         match /offers/{offerId} {
           allow read: if true;
           allow create: if request.auth != null
                         && request.resource.data.ownerId == request.auth.uid;
           allow update: if request.auth != null
                         && (request.auth.uid == get(/databases/$(database)/documents/trades/$(resource.data.tradeId)).data.ownerId
                             || request.auth.uid == resource.data.ownerId
                             || isAdmin());
           allow delete: if isAdmin();

           match /messages/{messageId} {
             allow read: if request.auth != null;
             allow create: if request.auth != null
                           && request.resource.data.senderId == request.auth.uid;
             allow update, delete: if false;
           }
         }

         // Admin-only price/value overrides. Anyone can read them (so the
         // fairness meter uses the latest numbers) but only the admin
         // account can write.
         match /itemOverrides/{itemId} {
           allow read: if true;
           allow write: if isAdmin();
         }
       }
     }

  5. Project settings (gear icon) → General → "Your apps" → Web app →
     copy the firebaseConfig object → paste over the one below.
  6. Upload this single file to GitHub Pages / Vercel / Firebase Hosting /
     Cloudflare Pages. Done — no build step, no server, no dependencies.

  ADMIN ACCESS: click the small "Admin" link in the top bar and sign in
  with Google using jakelordclash@gmail.com. Anyone else who tries will
  simply see nothing extra (and Firestore rules block writes regardless
  of what the client shows). Admin sign-in swaps your session from
  anonymous to that Google account, so posting trades as the admin will
  use the Google-account uid instead.

  Trade values in ITEM DATABASE are starting community estimates — Blox
  Fruits values drift with updates. The admin panel lets the admin adjust
  them live, without editing code, and those overrides sync to everyone.

  Every open trade auto-expires 48 hours after it's posted: expired
  trades vanish from the feed immediately (client-side filter) and get
  swept up and deleted from Firestore by a purge routine that runs once
  per page load.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RentAFruit — Blox Fruits Trade Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#05040F;
    --bg-deep-2:#0A0820;
    --bg-surface:rgba(20,18,46,0.55);
    --bg-surface-2:rgba(32,28,68,0.6);
    --border:rgba(140,130,255,0.22);
    --border-soft:rgba(140,130,255,0.12);
    --text-primary:#F1EEFF;
    --text-secondary:#A79FD1;
    --text-faint:#645C90;
    --neon-cyan:#4CF5E0;
    --neon-cyan-glow:rgba(76,245,224,0.45);
    --neon-violet:#B285FF;
    --neon-violet-glow:rgba(178,133,255,0.45);
    --neon-pink:#FF6FD8;
    --danger:#FF5D7A;
    --common:#9CA3AF;
    --uncommon:#4ADE80;
    --rare:#38BDF8;
    --legendary:#FB923C;
    --mythical:#FF5D9E;
    --perm-gold:#FFD166;
    --perm-glow:rgba(255,209,102,0.4);
    --gamepass-neon:#B285FF;
    --gamepass-glow:rgba(178,133,255,0.4);
    --radius:12px;
    --radius-lg:18px;
    --font-display:'Bebas Neue', sans-serif;
    --font-body:'Space Grotesk', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-deep);
    color:var(--text-primary);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  #starfield{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% -10%, #14103A 0%, #05040F 60%);}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--neon-cyan);outline-offset:2px;}
  ::selection{background:var(--neon-violet-glow);}

  /* ---------- layout shell ---------- */
  #app{max-width:1180px;margin:0 auto;padding:0 20px 80px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:22px 0 18px;flex-wrap:wrap;
    border-bottom:1px solid var(--border-soft);margin-bottom:28px;
  }
  .brand{display:flex;align-items:baseline;gap:2px;cursor:pointer;}
  .brand-mark{
    font-family:var(--font-display);font-size:32px;letter-spacing:0.5px;
    background:linear-gradient(90deg,#F1EEFF,var(--neon-cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    line-height:1;
  }
  .brand-mark span{
    background:linear-gradient(90deg,var(--neon-violet),var(--neon-pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .topbar-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .live-pill{
    display:flex;align-items:center;gap:8px;font-family:var(--font-mono);
    font-size:12px;color:var(--text-secondary);letter-spacing:0.3px;
  }
  .radar-dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--neon-cyan);flex:none;box-shadow:0 0 6px var(--neon-cyan);}
  .radar-dot::after{
    content:'';position:absolute;inset:-6px;border-radius:50%;
    border:1.5px solid var(--neon-cyan);opacity:0;animation:ping 2.2s ease-out infinite;
  }
  @keyframes ping{0%{opacity:0.65;transform:scale(0.4);}80%{opacity:0;transform:scale(2.2);}100%{opacity:0;}}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border-radius:9px;border:1px solid transparent;font-weight:600;font-size:14px;
    padding:11px 18px;transition:transform .12s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.96);}
  .btn-brass{background:linear-gradient(135deg,var(--neon-cyan),var(--neon-violet));color:#0A0820;}
  .btn-brass:hover{box-shadow:0 0 18px var(--neon-cyan-glow);}
  .btn-ghost{background:rgba(255,255,255,0.03);color:var(--text-primary);border-color:var(--border);backdrop-filter:blur(10px);}
  .btn-ghost:hover{border-color:var(--neon-cyan);color:var(--neon-cyan);}
  .btn-danger{background:transparent;color:var(--danger);border-color:rgba(255,93,122,0.4);}
  .btn-danger:hover{background:rgba(255,93,122,0.08);box-shadow:0 0 14px rgba(255,93,122,0.25);}
  .btn-admin{background:rgba(255,209,102,0.1);color:var(--perm-gold);border-color:rgba(255,209,102,0.4);}
  .btn-admin:hover{box-shadow:0 0 14px var(--perm-glow);}
  .btn-sm{padding:8px 13px;font-size:12.5px;border-radius:7px;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;transform:none;box-shadow:none;}
  .link-btn{background:none;border:none;color:var(--text-faint);font-family:var(--font-mono);font-size:11.5px;letter-spacing:0.4px;padding:4px 2px;}
  .link-btn:hover{color:var(--neon-cyan);}

  /* ---------- glass panel base ---------- */
  .glass{
    background:var(--bg-surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
  }

  /* ---------- item badges + rarity glow ---------- */
  .item-badge{
    font-family:var(--font-mono);font-size:8.5px;letter-spacing:0.8px;text-transform:uppercase;
    padding:2px 6px;border-radius:4px;font-weight:700;line-height:1.5;
  }
  .badge-physical{background:rgba(76,245,224,0.12);color:var(--neon-cyan);}
  .badge-perm{background:rgba(255,209,102,0.16);color:var(--perm-gold);}
  .badge-gamepass{background:rgba(178,133,255,0.18);color:var(--gamepass-neon);}
  @keyframes glowpulse{
    0%,100%{box-shadow:0 0 0 0 var(--glow-color);}
    50%{box-shadow:0 0 12px 1px var(--glow-color);}
  }
  .glow-perm{--glow-color:var(--perm-glow);border-color:rgba(255,209,102,0.55) !important;animation:glowpulse 2.8s ease-in-out infinite;}
  .glow-gamepass{--glow-color:var(--gamepass-glow);border-color:rgba(178,133,255,0.55) !important;animation:glowpulse 2.8s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){ .glow-perm,.glow-gamepass{animation:none;} }

  /* ---------- feed toolbar ---------- */
  .feed-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap;}
  .feed-title{font-family:var(--font-display);font-size:36px;letter-spacing:0.3px;line-height:1;
    background:linear-gradient(90deg,#F1EEFF,var(--neon-violet));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .feed-count{font-family:var(--font-mono);color:var(--text-faint);font-size:12.5px;margin-top:4px;}
  .filter-block{margin-bottom:14px;}
  .filter-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-faint);margin-bottom:7px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    font-family:var(--font-mono);font-size:11.5px;letter-spacing:0.4px;text-transform:uppercase;
    padding:6px 12px;border-radius:999px;border:1px solid var(--border);color:var(--text-secondary);
    background:rgba(255,255,255,0.02);transition:all .12s ease;
  }
  .chip:hover{border-color:var(--neon-cyan);color:var(--text-primary);}
  .chip.active{background:linear-gradient(135deg,var(--neon-cyan),var(--neon-violet));color:#0A0820;border-color:transparent;}
  .chip.cat-perm.active{background:var(--perm-gold);border-color:var(--perm-gold);color:#221703;}
  .chip.cat-gamepass.active{background:var(--gamepass-neon);border-color:var(--gamepass-neon);color:#140B33;}
  .search-input{
    width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);
    color:var(--text-primary);padding:10px 14px;border-radius:9px;font-size:13.5px;margin-bottom:14px;
  }
  .search-input::placeholder{color:var(--text-faint);}

  /* ---------- trade card grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(300px,1fr));gap:16px;}
  .empty-state{
    text-align:center;padding:70px 20px;color:var(--text-faint);border:1px dashed var(--border);
    border-radius:var(--radius-lg);font-size:14px;
  }
  .empty-state strong{display:block;color:var(--text-secondary);font-family:var(--font-display);
    font-size:20px;letter-spacing:0.3px;margin-bottom:6px;font-weight:400;}

  .card{
    position:relative;padding:18px 18px 16px;cursor:pointer;
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    display:flex;flex-direction:column;gap:12px;overflow:hidden;
  }
  .card:hover{border-color:var(--neon-cyan);transform:translateY(-3px);box-shadow:0 14px 34px -16px rgba(76,245,224,0.35);}
  .stamp{
    position:absolute;top:14px;right:-30px;transform:rotate(38deg);
    font-family:var(--font-mono);font-size:10px;letter-spacing:2px;font-weight:600;
    padding:3px 34px;border:1.5px solid;
  }
  .stamp.open{color:var(--uncommon);border-color:var(--uncommon);}
  .stamp.closed{color:var(--perm-gold);border-color:var(--perm-gold);}
  .stamp.cancelled{color:var(--text-faint);border-color:var(--text-faint);}
  .card-row-label{font-family:var(--font-mono);font-size:10px;letter-spacing:1.6px;color:var(--text-faint);text-transform:uppercase;}
  .slots{display:flex;gap:7px;flex-wrap:wrap;}
  .slot{
    display:flex;align-items:center;gap:6px;background:var(--bg-surface-2);
    border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12.5px;font-weight:600;
  }
  .slot-dot{width:7px;height:7px;border-radius:2px;flex:none;}
  .slot-value{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);font-weight:500;}
  .slot-empty{color:var(--text-faint);font-size:12px;font-style:italic;font-weight:400;}
  .swap-divider{display:flex;align-items:center;gap:10px;color:var(--text-faint);font-family:var(--font-mono);font-size:11px;}
  .swap-divider::before,.swap-divider::after{content:'';flex:1;height:1px;background:var(--border-soft);}
  .card-note{font-size:12.5px;color:var(--text-secondary);font-style:italic;}
  .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px;padding-top:12px;border-top:1px solid var(--border-soft);}
  .poster{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}
  .avatar{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--neon-cyan),var(--neon-violet));flex:none;
    display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:#0A0820;font-weight:700;}
  .timeago{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}

  /* ---------- fairness meter ---------- */
  .fair-meter{margin-top:2px;}
  .fair-track{display:flex;height:7px;border-radius:999px;overflow:hidden;background:rgba(0,0,0,0.3);border:1px solid var(--border-soft);}
  .fair-fill-a{background:linear-gradient(90deg,var(--neon-violet),var(--neon-pink));transition:width .25s ease;}
  .fair-fill-b{background:linear-gradient(90deg,var(--neon-cyan),#8CFFF0);transition:width .25s ease;}
  .fair-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);flex-wrap:wrap;}
  .fair-side b{color:var(--text-secondary);font-weight:600;}
  .fair-verdict{font-weight:700;letter-spacing:0.3px;text-transform:uppercase;font-size:10px;}
  .tone-good{color:var(--uncommon);}
  .tone-warn{color:var(--perm-gold);}
  .tone-bad{color:var(--danger);}
  .tone-neutral{color:var(--text-faint);}

  /* ---------- forms / pages ---------- */
  .page{max-width:760px;margin:0 auto;}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:13px;
    font-family:var(--font-mono);margin-bottom:20px;background:none;border:none;padding:0;}
  .back-link:hover{color:var(--neon-cyan);}
  .panel{padding:28px;}
  .page-title{font-family:var(--font-display);font-size:34px;margin:0 0 4px;letter-spacing:0.3px;}
  .page-sub{color:var(--text-faint);font-size:13.5px;margin:0 0 26px;}
  .field{margin-bottom:22px;}
  .field-label{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--text-secondary);margin-bottom:9px;}
  .field-hint{font-size:12px;color:var(--text-faint);margin-top:7px;}
  .text-input{
    width:100%;background:rgba(0,0,0,0.25);border:1px solid var(--border);color:var(--text-primary);
    padding:11px 13px;border-radius:9px;font-size:14px;
  }
  .text-input:focus{border-color:var(--neon-cyan);}
  textarea.text-input{resize:vertical;min-height:64px;}

  .picker{border:1px solid var(--border);border-radius:12px;background:rgba(0,0,0,0.2);padding:12px;}
  .picker-top{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .picker-cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .picker-rarity-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;max-height:220px;overflow-y:auto;padding-right:2px;}
  .fruit-tile{
    display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:8px;
    border:1px solid var(--border);background:rgba(255,255,255,0.02);font-size:12.5px;font-weight:600;
    color:var(--text-secondary);text-align:left;transition:all .1s ease;position:relative;
  }
  .fruit-tile:hover{border-color:var(--neon-cyan);color:var(--text-primary);}
  .fruit-tile.selected{border-color:var(--neon-cyan);background:rgba(76,245,224,0.12);color:var(--text-primary);animation:tilepop .22s ease;}
  @keyframes tilepop{0%{transform:scale(0.94);}60%{transform:scale(1.03);}100%{transform:scale(1);}}
  .fruit-tile.disabled{opacity:0.3;pointer-events:none;}
  .fruit-dot{width:7px;height:7px;border-radius:2px;flex:none;}
  .fruit-tile-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fruit-tile-val{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);flex:none;}
  .picker-selected{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;min-height:34px;}
  .selected-chip{
    display:flex;align-items:center;gap:7px;background:var(--bg-surface-2);border:1px solid var(--neon-cyan);
    border-radius:8px;padding:6px 6px 6px 10px;font-size:12.5px;font-weight:600;
  }
  .chip-remove{background:none;border:none;color:var(--text-faint);font-size:14px;line-height:1;padding:2px 4px;}
  .chip-remove:hover{color:var(--danger);}
  .picker-count{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-top:8px;}

  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap;}
  .error-msg{color:var(--danger);font-size:13px;margin-top:10px;min-height:1px;}

  /* ---------- trade detail ---------- */
  .detail-hero{padding:26px;position:relative;overflow:hidden;margin-bottom:26px;}
  .detail-poster{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .detail-poster-name{font-family:var(--font-display);font-size:22px;letter-spacing:0.3px;}
  .detail-slots-block{margin-bottom:16px;}
  .detail-slots{display:flex;gap:10px;flex-wrap:wrap;}
  .big-slot{
    display:flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);
    border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;
  }
  .big-slot .fruit-dot{width:9px;height:9px;}
  .rarity-tag{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;}
  .result-banner{display:flex;align-items:center;gap:10px;background:rgba(76,245,224,0.08);border:1px solid var(--neon-cyan);
    border-radius:10px;padding:12px 16px;color:var(--text-primary);font-size:13px;margin-top:18px;}

  .thread{margin-top:6px;}
  .thread-title{font-family:var(--font-display);font-size:24px;margin:0 0 14px;letter-spacing:0.3px;}
  .offer-item{padding:16px 18px;margin-bottom:12px;transition:border-color .15s ease;border:1px solid var(--border-soft);border-radius:12px;background:var(--bg-surface);backdrop-filter:blur(14px);}
  .offer-item.accepted{border-color:var(--uncommon);}
  .offer-item.declined{opacity:0.55;}
  .offer-item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
  .offer-item-name{font-weight:700;font-size:13.5px;}
  .offer-badge{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:5px;}
  .offer-badge.accept{background:rgba(76,245,224,0.12);color:var(--neon-cyan);}
  .offer-badge.counter{background:rgba(178,133,255,0.14);color:var(--gamepass-neon);}
  .offer-badge.accepted{background:rgba(74,222,128,0.18);color:var(--uncommon);}
  .offer-badge.declined{background:rgba(255,93,122,0.12);color:var(--danger);}
  .offer-note{font-size:12.5px;color:var(--text-secondary);font-style:italic;margin-top:8px;}
  .offer-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
  .offer-fair{margin-top:10px;}

  .chat-panel{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border-soft);}
  .chat-messages{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;padding:2px 2px 6px;}
  .msg-bubble{max-width:78%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.4;}
  .msg-theirs{align-self:flex-start;background:var(--bg-surface-2);border:1px solid var(--border);border-bottom-left-radius:3px;}

(function starfield(){
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let w, h, stars = [], dust = [];
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    const count = Math.floor((w*h)/9000);
    stars = Array.from({length: count}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      r: Math.random()*1.4 + 0.3,
      baseA: Math.random()*0.5 + 0.35,
      phase: Math.random()*Math.PI*2,
      speed: Math.random()*0.015 + 0.006,
      hue: Math.random() < 0.15 ? (Math.random()<0.5 ? '178,133,255' : '76,245,224') : '241,238,255'
    }));
    dust = Array.from({length: Math.floor(count/8)}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-0.5)*0.06, vy: (Math.random()-0.5)*0.06,
      r: Math.random()*1.8 + 0.6
    }));
  }
  function frame(t){
    ctx.clearRect(0,0,w,h);
    stars.forEach(s=>{
      const a = s.baseA + Math.sin(t*s.speed + s.phase) * 0.35;
      ctx.beginPath();
      ctx.fillStyle = `rgba(${s.hue},${Math.max(0.08,a)})`;
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    });
    dust.forEach(d=>{
      d.x += d.vx; d.y += d.vy;
      if (d.x < -5) d.x = w+5; if (d.x > w+5) d.x = -5;
      if (d.y < -5) d.y = h+5; if (d.y > h+5) d.y = -5;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(178,133,255,0.10)';
      ctx.arc(d.x, d.y, d.r*3, 0, Math.PI*2);
      ctx.fill();
    });
    if (!reduced) requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize);
  resize();
  if (reduced) { frame(0); } else { requestAnimationFrame(frame); }
})();

/* ============================================================
   48-HOUR AUTO-EXPIRY
   ============================================================ */
function isExpired(t){
  if (!t.createdAt) return false;
  const created = t.createdAt.toDate ? t.createdAt.toDate() : new Date(t.createdAt);
  return (Date.now() - created.getTime()) > TRADE_LIFETIME_MS;
}

async function runExpiryPurge(){
  if (purgeRan) return;
  purgeRan = true;
  try {
    const cutoff = Timestamp.fromMillis(Date.now() - TRADE_LIFETIME_MS);
    const q = query(collection(db,'trades'), where('status','==','open'), where('createdAt','<', cutoff));
    const snap = await getDocs(q);
    if (snap.empty) return;
    await Promise.all(snap.docs.map(d => deleteDoc(doc(db,'trades', d.id)).catch(()=>{
      // If security rules don't grant delete to this client (non-admin),
      // fall back to just marking it closed so it disappears from the feed.
      return updateDoc(doc(db,'trades', d.id), { status:'closed', cancelled:true }).catch(()=>{});
    })));
  } catch(err){
    console.warn('Expiry purge skipped:', err.message);
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeAgo(ts){
  if (!ts) return 'just now';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const secs = Math.floor((Date.now() - d.getTime())/1000);
  if (secs < 60) return 'just now';
  if (secs < 3600) return Math.floor(secs/60)+'m ago';
  if (secs < 86400) return Math.floor(secs/3600)+'h ago';
  return Math.floor(secs/86400)+'d ago';
}
function initials(name){
  return (name || '?').trim().slice(0,2).toUpperCase();
}
function formatValue(n){
  n = n || 0;
  if (n >= 1000) return (n/1000).toFixed(n % 1000 === 0 ? 0 : 1) + 'k';
  return String(n);
}
function itemBadge(cat){
  return `<span class="item-badge badge-${cat}">${CATEGORY_META[cat].label}</span>`;
}
function slotHtml(item, big){
  const cls = big ? 'big-slot' : 'slot';
  const glow = item.category !== 'physical' ? ' glow-'+item.category : '';
  return `<span class="${cls}${glow}">
      <span class="fruit-dot" style="background:${RARITY_COLOR[item.rarity]}"></span>
      ${esc(item.name)}
      ${itemBadge(item.category)}
      <span class="slot-value">~${formatValue(item.value)}</span>
      ${big ? `<span class="rarity-tag">${esc(item.rarity)}</span>` : ''}
    </span>`;
}
function sumValue(items){
  return (items||[]).reduce((s,i)=> s + (i.value||0), 0);
}
function fairnessVerdict(aVal, bVal, aLabel, bLabel){
  if (!aVal && !bVal) return {label:'No values set', tone:'neutral'};
  if (!bVal) return {label:'Open — no fixed ask', tone:'neutral'};
  if (!aVal) return {label:'Nothing offered yet', tone:'neutral'};
  const ratio = aVal / bVal;
  if (ratio >= 0.85 && ratio <= 1.15) return {label:'Balanced Trade', tone:'good'};
  if (ratio > 1.15 && ratio <= 1.5)  return {label:`${aLabel} side richer`, tone:'warn'};
  if (ratio > 1.5)                    return {label:`${aLabel} side much richer`, tone:'bad'};
  if (ratio < 0.85 && ratio >= 0.66)  return {label:`${bLabel} side richer`, tone:'warn'};
  return {label:`${bLabel} side much richer`, tone:'bad'};
}
function fairnessBarHtml(aItems, bItems, aLabel, bLabel){
  aLabel = aLabel || 'Offering'; bLabel = bLabel || 'Wants';
  const a = sumValue(aItems), b = sumValue(bItems);
  const total = (a + b) || 1;
  const aPct = Math.max(4, Math.min(96, (a/total)*100));
  const v = fairnessVerdict(a, b, aLabel, bLabel);
  return `
    <div class="fair-meter">
      <div class="fair-track">
        <div class="fair-fill-a" style="width:${aPct}%"></div>
        <div class="fair-fill-b" style="width:${100-aPct}%"></div>
      </div>
      <div class="fair-row">
        <span class="fair-side">${esc(aLabel)} <b>~${formatValue(a)}</b></span>
        <span class="fair-verdict tone-${v.tone}">${v.label}</span>
        <span class="fair-side">${esc(bLabel)} <b>~${formatValue(b)}</b></span>
      </div>
    </div>`;
}
function cleanupListeners(){
  if (unsubDetail) { unsubDetail(); unsubDetail = null; }
  if (unsubOffers) { unsubOffers(); unsubOffers = null; }
  Object.values(chatUnsubs).forEach(fn => fn());
  chatUnsubs = {};
  confirmedMessages = {};
  pendingMessages = {};
  expandedChats = new Set();
  currentOffers = [];
}
function showToast(msg, tone){
  tone = tone || 'good';
  let host = document.getElementById('toast-host');
  if (!host){
    host = document.createElement('div');
    host.id = 'toast-host';
    host.className = 'toast-host';
    document.body.appendChild(host);
  }
  const t = document.createElement('div');
  t.className = 'toast tone-'+tone;
  t.textContent = msg;
  host.appendChild(t);
  requestAnimationFrame(()=> t.classList.add('show'));
  setTimeout(()=>{
    t.classList.remove('show');
    setTimeout(()=> t.remove(), 300);
  }, 3200);
}

/* ============================================================
   ROUTER
   ============================================================ */
window.addEventListener('hashchange', router);
function router(){
  if (!uid) return;
  const hash = location.hash || '#/';
  cleanupListeners();
  if (hash.startsWith('#/trade/')) {
    renderTradeDetail(hash.replace('#/trade/',''));
  } else if (hash === '#/post') {
    renderPostForm();
  } else {
    renderHome();
  }
  window.scrollTo(0,0);
}

/* ============================================================
   HOME FEED
   ============================================================ */
function renderHome(){
  if (!unsubFeed) {
    const q = query(collection(db,'trades'), where('status','==','open'), orderBy('createdAt','desc'));
    unsubFeed = onSnapshot(q, (snap) => {
      latestTrades = snap.docs.map(d => ({id:d.id, ...d.data()})).filter(t => !isExpired(t));
      liveCountEl.textContent = latestTrades.length + (latestTrades.length===1?' trade live':' trades live');
      if (!location.hash || location.hash === '#/') paintFeed();
    }, (err) => {
      viewRoot.innerHTML = `<div class="setup-note glass"><h2>⚠ Database error</h2><p>${esc(err.message)}</p>
        <p>This often means the Firestore security rules haven't been pasted in yet, or Firestore hasn't finished being created. See the setup comment at the top of this file.</p></div>`;
    });
  }
  paintFeed();
}

function tradeItemsPool(t){
  return [...(t.offering||[]), ...((t.wanting?.fruits)||[])];
}

function paintFeed(){
  const rows = latestTrades.filter(t => {
    const pool = tradeItemsPool(t);
    if (feedCategoryFilter !== 'All' && !pool.some(f=>f.category===feedCategoryFilter)) return false;
    if (feedRarityFilter !== 'All' && !pool.some(f=>f.rarity===feedRarityFilter)) return false;
    if (feedSearch) {
      const s = feedSearch.toLowerCase();
      const hay = [t.username, ...pool.map(f=>f.name), t.wanting?.note].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(s)) return false;
    }
    return true;
  });

  viewRoot.innerHTML = `
    <div class="feed-head">
      <div>
        <div class="feed-title">Live Trade Board</div>
        <div class="feed-count">${rows.length} open ${rows.length===1?'post':'posts'} · updates in real time · posts auto-expire after 48h</div>
      </div>
    </div>
    <input class="search-input" id="feed-search" placeholder="Search a fruit, gamepass, or username…" value="${esc(feedSearch)}">
    <div class="filter-block">
      <div class="filter-label">Item Type</div>
      <div class="filters">
        <button class="chip ${feedCategoryFilter==='All'?'active':''}" data-cat="All">All</button>
        ${CATEGORIES.map(c=>`<button class="chip cat-${c} ${feedCategoryFilter===c?'active':''}" data-cat="${c}">${CATEGORY_META[c].label}</button>`).join('')}
      </div>
    </div>
    <div class="filter-block">
      <div class="filter-label">Fruit Rarity</div>
      <div class="filters">
        <button class="chip ${feedRarityFilter==='All'?'active':''}" data-r="All">All</button>
        ${RARITIES.map(r=>`<button class="chip ${feedRarityFilter===r?'active':''}" data-r="${r}">${r}</button>`).join('')}
      </div>
    </div>
    <div class="grid" id="feed-grid" style="margin-top:20px">
      ${rows.length ? rows.map(cardHtml).join('') : `<div class="empty-state glass" style="grid-column:1/-1">
        <strong>No trades match yet</strong>No one's posted this combo right now — be the first.
      </div>`}
    </div>
  `;

  const searchEl = document.getElementById('feed-search');
  searchEl.addEventListener('input', (e)=>{
    feedSearch = e.target.value;
    paintFeed();
    const el = document.getElementById('feed-search');
    el.focus();
    el.selectionStart = el.selectionEnd = el.value.length;
  });
  document.querySelectorAll('.chip[data-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{ feedCategoryFilter = el.dataset.cat; paintFeed(); });
  });
  document.querySelectorAll('.chip[data-r]').forEach(el=>{
    el.addEventListener('click', ()=>{ feedRarityFilter = el.dataset.r; paintFeed(); });
  });
  document.querySelectorAll('.card[data-id]').forEach(el=>{
    el.addEventListener('click', ()=> location.hash = '#/trade/'+el.dataset.id);
  });
}

function cardHtml(t){
  const offering = t.offering || [];
  const wantFruits = t.wanting?.fruits || [];
  const wantNote = t.wanting?.note || '';
  return `
  <div class="card glass" data-id="${t.id}">
    <div class="stamp open">OPEN</div>
    <div>

/* ============================================================
   ITEM PICKER COMPONENT (vanilla, returns {el, getSelected})
   Filters: Item Type (Physical/Perm/Gamepass) + Rarity + Search.
   ============================================================ */
function createFruitPicker(maxCount, initial, onChange){
  let selected = [...(initial||[])];
  let cat = 'All';
  let rarity = 'All';
  let search = '';

  const wrap = document.createElement('div');
  wrap.className = 'picker';

  const catRow = document.createElement('div');
  catRow.className = 'picker-cat-row';
  const rarityRow = document.createElement('div');
  rarityRow.className = 'picker-rarity-row';
  const top = document.createElement('div');
  top.className = 'picker-top';
  const searchInput = document.createElement('input');
  searchInput.className = 'text-input';
  searchInput.placeholder = 'Search items…';
  top.appendChild(searchInput);

  const grid = document.createElement('div');
  grid.className = 'picker-grid';

  const selectedRow = document.createElement('div');
  selectedRow.className = 'picker-selected';

  const countEl = document.createElement('div');
  countEl.className = 'picker-count';

  wrap.append(top, catRow, rarityRow, grid, selectedRow, countEl);

  function isSelected(f){ return selected.some(s=>s.id===f.id); }
  function toggle(f){
    if (isSelected(f)) selected = selected.filter(s=>s.id!==f.id);
    else if (selected.length < maxCount) selected = [...selected, f];
    paint();
    if (onChange) onChange(selected);
  }

  function paint(){
    countEl.textContent = `${selected.length} / ${maxCount} selected`;

    catRow.innerHTML = '';
    ['All', ...CATEGORIES].forEach(c=>{
      const b = document.createElement('button');
      b.type = 'button';
      const label = c==='All' ? 'All Types' : CATEGORY_META[c].label;
      b.className = 'chip' + (c!=='All' ? ' cat-'+c : '') + (cat===c?' active':'');
      b.textContent = label;
      b.addEventListener('click', ()=>{ cat = c; paint(); });
      catRow.appendChild(b);
    });

    rarityRow.innerHTML = '';
    ['All', ...RARITIES].forEach(r=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (rarity===r?' active':'');
      b.textContent = r;
      b.addEventListener('click', ()=>{ rarity = r; paint(); });
      rarityRow.appendChild(b);
    });

    grid.innerHTML = '';
    ITEMS.filter(f =>
        (cat==='All' || f.category===cat) &&
        (rarity==='All' || f.rarity===rarity) &&
        f.name.toLowerCase().includes(search.toLowerCase())
      ).forEach(f=>{
        const btn = document.createElement('button');
        btn.type = 'button';
        const full = !isSelected(f) && selected.length >= maxCount;
        const glow = f.category!=='physical' ? ' glow-'+f.category : '';
        btn.className = 'fruit-tile' + (isSelected(f)?' selected':'') + (full?' disabled':'') + glow;
        btn.innerHTML = `<span class="fruit-dot" style="background:${RARITY_COLOR[f.rarity]}"></span><span class="fruit-tile-name">${esc(f.name)}</span><span class="fruit-tile-val">${formatValue(f.value)}</span>`;
        btn.addEventListener('click', ()=> toggle(f));
        grid.appendChild(btn);
      });
    if (!grid.children.length) {
      grid.innerHTML = `<div class="slot-empty" style="padding:10px 2px">No items match this filter.</div>`;
    }

    selectedRow.innerHTML = '';
    selected.forEach(f=>{
      const chip = document.createElement('div');
      chip.className = 'selected-chip';
      chip.innerHTML = `<span class="fruit-dot" style="background:${RARITY_COLOR[f.rarity]}"></span>${esc(f.name)}`;
      const rm = document.createElement('button');
      rm.className = 'chip-remove'; rm.type='button'; rm.textContent = '×';
      rm.addEventListener('click', ()=> toggle(f));
      chip.appendChild(rm);
      selectedRow.appendChild(chip);
    });
  }

  searchInput.addEventListener('input', (e)=>{ search = e.target.value; paint(); });
  paint();

  return { el: wrap, getSelected: () => selected };
}

/* ============================================================
   TRADE DETAIL + COUNTER OFFERS + CHAT
   ============================================================ */
function renderTradeDetail(tradeId){
  viewRoot.innerHTML = `<div class="page"><button class="back-link" id="back">← Back to board</button><div class="feed-count">Loading trade…</div></div>`;
  document.getElementById('back').addEventListener('click', ()=> location.hash = '#/');

  unsubDetail = onSnapshot(doc(db,'trades',tradeId), (snap)=>{
    if (!snap.exists()) {
      viewRoot.innerHTML = `<div class="page"><button class="back-link" id="back">← Back to board</button>
        <div class="empty-state glass"><strong>Trade not found</strong>It may have been removed.</div></div>`;
      document.getElementById('back').addEventListener('click', ()=> location.hash = '#/');
      return;
    }
    paintDetail(tradeId, {id:snap.id, ...snap.data()});
  });
}

function paintDetail(tradeId, t){
  const isOwner = t.ownerId === uid;
  const isOpen = t.status === 'open' && !isExpired(t);
  const offering = t.offering || [];
  const wantFruits = t.wanting?.fruits || [];
  const wantNote = t.wanting?.note || '';
  const acceptedOffer = t.closedWith ? currentOffers.find(o=>o.id===t.closedWith) : null;

  let stampClass = 'open', stampText = 'OPEN';
  if (!isOpen) {
    if (t.cancelled) { stampClass = 'cancelled'; stampText = 'CANCELLED'; }
    else if (t.status === 'open' && isExpired(t)) { stampClass = 'cancelled'; stampText = 'EXPIRED'; }
    else { stampClass = 'closed'; stampText = 'TRADED'; }
  }

  viewRoot.innerHTML = `
    <div class="page">
      <button class="back-link" id="back">← Back to board</button>

      <div class="detail-hero glass">
        <div class="stamp ${stampClass}">${stampText}</div>
        <div class="detail-poster"><span class="avatar">${esc(initials(t.username))}</span>
          <div><div class="detail-poster-name">${esc(t.username)}</div><div class="timeago">${timeAgo(t.createdAt)}</div></div>
        </div>
        <div class="detail-slots-block">
          <div class="card-row-label">Offering</div>
          <div class="detail-slots" style="margin-top:8px">${offering.map(f=>slotHtml(f,true)).join('')}</div>
        </div>
        <div class="detail-slots-block">
          <div class="card-row-label">Wants in return</div>
          <div class="detail-slots" style="margin-top:8px">${wantFruits.map(f=>slotHtml(f,true)).join('')}</div>
          ${wantNote ? `<div class="card-note" style="margin-top:8px">"${esc(wantNote)}"</div>` : ''}
          ${(!wantFruits.length && !wantNote) ? '<div class="slot-empty">open to any offer</div>' : ''}
        </div>
        ${(offering.length || wantFruits.length) ? fairnessBarHtml(offering, wantFruits) : ''}
        ${acceptedOffer ? `<div class="result-banner">✓ Traded with <b>${esc(acceptedOffer.username)}</b> for ${acceptedOffer.offering.map(f=>esc(f.name)).join(', ') || 'the requested items'}.</div>` : ''}
        ${(isOwner || isAdmin) ? `<div class="form-actions" style="margin-top:6px">
            ${(t.status==='open' && !t.cancelled) ? `<button class="btn btn-danger btn-sm" id="cancel-trade">Cancel this post</button>` : ''}
            ${isAdmin ? `<button class="btn btn-admin btn-sm" id="admin-delete-trade">Admin: Delete permanently</button>` : ''}
          </div>` : ''}
      </div>

      <div class="thread">
        <div class="thread-title">Counter Offers</div>
        <div id="offers-list"></div>
      </div>

      ${isOpen ? `
      <div class="make-offer-box glass" id="make-offer-box">
        <div class="card-row-label" style="margin-bottom:12px">Make an Offer</div>
        <div class="mo-choice">
          <button class="btn btn-brass" id="mo-accept">Send exactly what they want</button>
          <button class="btn btn-ghost" id="mo-counter">Propose a different offer</button>
        </div>
        <div id="mo-form"></div>
      </div>` : `<div class="closed-banner">${t.cancelled ? 'This trade was cancelled by its poster.' : (stampText==='EXPIRED' ? 'This trade expired 48 hours after posting.' : 'This trade is closed and no longer accepting offers.')}</div>`}
    </div>
  `;

  document.getElementById('back').addEventListener('click', ()=> location.hash = '#/');
  if ((isOwner || isAdmin) && t.status==='open' && !t.cancelled) {
    document.getElementById('cancel-trade').addEventListener('click', async ()=>{
      if (!confirm('Cancel this trade post? This cannot be undone.')) return;
      await updateDoc(doc(db,'trades',tradeId), { status:'closed', closedWith:null, cancelled:true });
      showToast('Trade cancelled.', 'warn');
    });
  }
  if (isAdmin) {
    const delBtn = document.getElementById('admin-delete-trade');
    if (delBtn) delBtn.addEventListener('click', async ()=>{
      if (!confirm('Permanently delete this trade? This cannot be undone.')) return;
      try {
        await deleteDoc(doc(db,'trades',tradeId));
        showToast('Trade deleted.', 'warn');
        location.hash = '#/';
      } catch(err){
        showToast('Could not delete: ' + err.message, 'bad');
      }
    });
  }

  if (isOpen) {
    document.getElementById('mo-accept').addEventListener('click', ()=> submitOffer(tradeId, t, 'accept', wantFruits, ''));
    document.getElementById('mo-counter').addEventListener('click', ()=> showCounterForm(tradeId, t));
  }

  if (unsubOffers) unsubOffers();
  const q = query(collection(db,'offers'), where('tradeId','==',tradeId), orderBy('createdAt','asc'));
  unsubOffers = onSnapshot(q, (snap)=>{
    currentOffers = snap.docs.map(d=>({id:d.id, ...d.data()}));
    paintOffers(tradeId, t, isOwner, isOpen);
  });
}

function paintOffers(tradeId, t, isOwner, isOpen){
  const listEl = document.getElementById('offers-list');
  if (!listEl) return;
  if (!currentOffers.length) {
    listEl.innerHTML = `<div class="empty-state glass">No offers yet — be the first to counter.</div>`;
    return;
  }
  listEl.innerHTML = currentOffers.map(o=>{
    const status = o.status || 'pending';
    const accepted = status === 'accepted';
    const declined = status === 'declined';
    let badgeClass, badgeText;
    if (accepted) { badgeClass = 'accepted'; badgeText = 'Accepted'; }
    else if (declined) { badgeClass = 'declined'; badgeText = 'Declined'; }
    else { badgeClass = o.type; badgeText = o.type==='accept' ? 'Sent what you asked' : 'Counter offer'; }
    const canChat = (isOwner || o.ownerId === uid);
    const chatOpen = expandedChats.has(o.id);

    return `
    <div class="offer-item ${accepted?'accepted':''} ${declined?'declined':''}">
      <div class="offer-item-head">
        <span class="offer-item-name">${esc(o.username)}</span>
        <span class="offer-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="slots">${(o.offering||[]).map(f=>slotHtml(f,false)).join('') || '<span class="slot-empty">no items listed</span>'}</div>
      ${o.note ? `<div class="offer-note">"${esc(o.note)}"</div>` : ''}
      ${o.offering?.length ? `<div class="offer-fair">${fairnessBarHtml(o.offering, t.offering||[], 'Their offer', 'Your items')}</div>` : ''}
      <div class="timeago" style="margin-top:8px">${timeAgo(o.createdAt)}</div>
      <div class="offer-actions">
        ${(isOwner && isOpen && status==='pending') ? `<button class="btn btn-brass btn-sm" data-accept="${o.id}">Accept this offer</button><button class="btn btn-danger btn-sm" data-decline="${o.id}">Decline</button>` : ''}
        ${canChat ? `<button class="chat-toggle" data-chat-toggle="${o.id}">${chatOpen ? 'Hide chat' : '💬 Chat'}</button>` : ''}
      </div>
      ${(canChat && chatOpen) ? chatPanelHtml(o.id) : ''}
    </div>`;
  }).join('');

  listEl.querySelectorAll('[data-accept]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const offerId = btn.dataset.accept;
      btn.disabled = true; btn.textContent = 'Accepting…';
      try {
        await updateDoc(doc(db,'trades',tradeId), { status:'closed', closedWith: offerId, cancelled:false });
        await updateDoc(doc(db,'offers',offerId), { status:'accepted' });
        const others = currentOffers.filter(o=>o.id!==offerId && (o.status||'pending')==='pending');
        await Promise.all(others.map(o=> updateDoc(doc(db,'offers',o.id), { status:'declined' })));
        showToast('Offer accepted — trade closed.', 'good');
      } catch(err){
        showToast('Could not accept offer: ' + err.message, 'bad');
        btn.disabled = false; btn.textContent = 'Accept this offer';
      }
    });
  });
  listEl.querySelectorAll('[data-decline]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const offerId = btn.dataset.decline;
      btn.disabled = true;
      try {
        await updateDoc(doc(db,'offers',offerId), { status:'declined' });
        showToast('Offer declined.', 'warn');
      } catch(err){
        showToast('Could not decline offer: ' + err.message, 'bad');
        btn.disabled = false;
      }
    });
  });
  listEl.querySelectorAll('[data-chat-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const offerId = btn.dataset.chatToggle;
      if (expandedChats.has(offerId)) {
        expandedChats.delete(offerId);
        if (chatUnsubs[offerId]) { chatUnsubs[offerId](); delete chatUnsubs[offerId]; }
      } else {
        expandedChats.add(offerId);
      }
      paintOffers(tradeId, t, isOwner, isOpen);
    });
  });

  currentOffers.forEach(o=>{
    if (!expandedChats.has(o.id)) return;
    subscribeChat(o.id);
    const input = document.getElementById('chat-input-'+o.id);
    const sendBtn = listEl.querySelector(`[data-send="${o.id}"]`);
    if (input) input.addEventListener('keydown', (e)=>{
      if (e.key === 'Enter') { sendChatMessage(o.id, t, o, input.value); input.value=''; }
    });
    if (sendBtn) sendBtn.addEventListener('click', ()=>{
      sendChatMessage(o.id, t, o, input.value);
      input.value = '';
    });
    renderChatMessages(o.id);
  });
}

function showCounterForm(tradeId, t){
  const box = document.getElementById('mo-form');
  box.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'field-label';
  label.style.marginTop = '16px';
  label.textContent = "What you're offering instead";
  const fairSlot = document.createElement('div');
  fairSlot.style.marginTop = '12px';
  const noteWrap = document.createElement('textarea');
  noteWrap.className = 'text-input';
  noteWrap.placeholder = 'Optional note…';
  noteWrap.maxLength = 140;
  noteWrap.style.marginTop = '12px';
  const sendBtn = document.createElement('button');
  sendBtn.className = 'btn btn-brass';
  sendBtn.style.marginTop = '14px';
  sendBtn.textContent = 'Send Counter Offer';
  const err = document.createElement('div');
  err.className = 'error-msg';

  function refreshFair(sel){
    fairSlot.innerHTML = fairnessBarHtml(sel, t.offering||[], 'Your offer', 'Their items');
  }
  const picker = createFruitPicker(4, [], refreshFair);
  refreshFair([]);

  sendBtn.addEventListener('click', ()=>{
    const sel = picker.getSelected();
    const note = noteWrap.value.trim();
    if (!sel.length && !note) { err.textContent = 'Add at least one item or a note.'; return; }
    err.textContent = '';
    sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
    submitOffer(tradeId, t, 'counter', sel, note);
  });

  box.append(label, picker.el, fairSlot, noteWrap, err, sendBtn);
}

async function submitOffer(tradeId, t, type, offering, note){
  const username = prompt("Your in-game name, so they know who's offering:", lastUsedName || '');
  if (!username || !username.trim()) return;
  try {
    lastUsedName = username.trim();
    await addDoc(collection(db,'offers'), {
      ownerId: uid,
      tradeId,
      username: username.trim().slice(0,24),
      type,
      status: 'pending',
      offering,
      note,
      createdAt: serverTimestamp()
    });
    showToast('Offer sent!', 'good');
  } catch(err){
    showToast('Could not send offer: ' + err.message, 'bad');
  }
}

/* ============================================================
   DEAL CHAT — real-time per-offer thread with optimistic sends
   ============================================================ */
function chatPanelHtml(offerId){
  return `<div class="chat-panel" data-chat="${offerId}">
    <div class="chat-messages" id="chat-msgs-${offerId}"><div class="feed-count">Loading chat…</div></div>
    <div class="chat-input-row">
      <input class="text-input chat-input" id="chat-input-${offerId}" placeholder="Type a message…" maxlength="300">
      <button class="btn btn-brass btn-sm" data-send="${offerId}">Send</button>
    </div>
  </div>`;
}

function subscribeChat(offerId){
  if (chatUnsubs[offerId]) return;
  const q = query(collection(db,'offers',offerId,'messages'), orderBy('createdAt','asc'));
  chatUnsubs[offerId] = onSnapshot(q, (snap)=>{
    confirmedMessages[offerId] = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if (pendingMessages[offerId]) {
      const confirmedTemp = new Set(confirmedMessages[offerId].map(m=>m.tempId).filter(Boolean));
      pendingMessages[offerId] = pendingMessages[offerId].filter(m=>!confirmedTemp.has(m.tempId));
    }
    renderChatMessages(offerId);
  });
}

function renderChatMessages(offerId){
  const el = document.getElementById('chat-msgs-'+offerId);
  if (!el) return;
  const confirmed = confirmedMessages[offerId] || [];
  const pending = pendingMessages[offerId] || [];
  const merged = [...confirmed, ...pending].sort((a,b)=>{
    const at = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.localTs||0);
    const bt = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.localTs||0);
    return at-bt;
  });
  if (!merged.length) {
    el.innerHTML = '<div class="feed-count" style="padding:8px 0">No messages yet — say hi.</div>';
    return;
  }
  el.innerHTML = merged.map(m=>{
    const mine = m.senderId === uid;
    return `<div class="msg-bubble ${mine?'msg-mine':'msg-theirs'} ${m.pending?'msg-pending':''}">
      ${!mine ? `<div class="msg-meta">${esc(m.senderName)}</div>` : ''}
      <div>${esc(m.text)}</div>
      <div class="msg-meta">${m.pending ? (m.failed ? 'failed to send' : 'sending…') : timeAgo(m.createdAt)}</div>
    </div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

async function sendChatMessage(offerId, t, o, rawText){
  const text = (rawText||'').trim();
  if (!text) return;
  const myName = uid === t.ownerId ? t.username : o.username;
  const tempId = 'tmp_' + Math.random().toString(36).slice(2,10);
  pendingMessages[offerId] = [...(pendingMessages[offerId]||[]), {
    tempId, senderId: uid, senderName: myName, text, pending: true, localTs: Date.now()
  }];
  renderChatMessages(offerId);
  try {
    await addDoc(collection(db,'offers',offerId,'messages'), {
      senderId: uid, senderName: myName, text, tempId, createdAt: serverTimestamp()
    });
  } catch(err){
    pendingMessages[offerId] = (pendingMessages[offerId]||[]).map(m=>
      m.tempId===tempId ? {...m, failed:true} : m
    );
    renderChatMessages(offerId);
    showToast('Message failed to send', 'bad');
  }
}
